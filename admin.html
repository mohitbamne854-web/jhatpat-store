<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhatpat - Super Admin Control Room</title>
    <style>
        :root { --yellow: #f8cb46; --green: #0c831f; --dark: #1c1c1c; --bg: #f4f6fb; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 60px; }
        header { background: var(--yellow); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        header h1 { font-size: 20px; font-weight: 900; }
        .analytics-bar { max-width: 1050px; margin: 12px auto 0; padding: 0 14px; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat-card { background: white; padding: 12px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.04); }
        .stat-card h3 { font-size: 18px; color: var(--green); font-weight: 900; }
        .stat-card p { font-size: 11px; color: #666; font-weight: 700; }
        .tabs { display: flex; background: white; padding: 10px; gap: 8px; overflow-x: auto; margin-top: 12px; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 9px 14px; border: none; background: #eee; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--green); color: white; }
        .container { max-width: 1050px; margin: 14px auto; padding: 0 14px; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
        .card h2 { font-size: 16px; color: var(--green); margin-bottom: 12px; border-bottom: 2px solid #f0f0f0; padding-bottom: 6px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        input, select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: white; }
        .btn-main { background: var(--green); color: white; border: none; padding: 13px; border-radius: 8px; font-weight: 800; width: 100%; margin-top: 10px; font-size: 15px; cursor: pointer; }
        .item-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
        .list-card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
        .list-card img { width: 100%; height: 115px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #f9fafb; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 800; }
        .bg-open { background: #dcfce7; color: #166534; }
        .bg-closed { background: #fee2e2; color: #991b1b; }
        .act-row { display: flex; gap: 6px; margin-top: 10px; }
        .btn-s { flex: 1; padding: 7px; border: none; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }
        #login-modal { position: fixed; inset: 0; background: var(--yellow); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 28px; border-radius: 16px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    </style>
</head>
<body>
    <div id="login-modal">
        <div class="login-box">
            <h1 style="margin-bottom:4px;">⚡ Jhatpat Admin</h1>
            <p style="font-size:13px;color:#666;margin-bottom:18px;">Super Admin Control Room</p>
            <input type="password" id="admin-pass" placeholder="Enter Password (MOHIT@001)" style="margin-bottom:12px;">
            <button type="button" class="btn-main" onclick="verifyAdmin()">Login to Control Room</button>
        </div>
    </div>

    <header>
        <h1>⚡ Jhatpat Master Admin</h1>
        <button onclick="localStorage.removeItem('jhatpat_admin');location.reload();" style="background:#1c1c1c;color:white;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:bold;">Lock</button>
    </header>

    <div class="analytics-bar">
        <div class="filter-row">
            <select id="analytics-store-filter" onchange="renderOrdersAndStats()">
                <option value="ALL">📊 Global Analytics: ALL STORES</option>
            </select>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><h3 id="stat-rev">₹0</h3><p>REVENUE</p></div>
            <div class="stat-card"><h3 id="stat-ord">0</h3><p>ORDERS</p></div>
            <div class="stat-card"><h3 id="stat-prd">0</h3><p>MASTER ITEMS</p></div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('tab-stores', this)">🏪 Dark Stores</button>
        <button class="tab-btn" onclick="openTab('tab-prods', this)">🥬 Master Catalog</button>
        <button class="tab-btn" onclick="openTab('tab-orders', this)">📦 Live Orders</button>
        <button class="tab-btn" onclick="openTab('tab-riders', this)">🛵 Active Riders</button>
    </div>

    <div class="container">
        <div id="tab-stores" class="section active">
            <div class="card">
                <h2>🏪 Open New Dark Store</h2>
                <div class="grid-form">
                    <input type="text" id="s-name" placeholder="Store Name (e.g. Jhatpat Dombivli)">
                    <input type="text" id="s-area" placeholder="Area / Locality (e.g. Dombivli East)">
                    <input type="text" id="s-addr" placeholder="Full Store Address">
                    <input type="number" step="any" id="s-lat" placeholder="Latitude (e.g. 19.2056)">
                    <input type="number" step="any" id="s-lng" placeholder="Longitude (e.g. 73.0954)">
                    <input type="number" id="s-rad" placeholder="Delivery Radius in KM (e.g. 5)">
                    <input type="text" id="s-mgr" placeholder="Store Manager Name">
                    <input type="tel" id="s-phone" placeholder="Manager Phone Number">
                    <input type="text" id="s-id" placeholder="Store Login ID">
                    <input type="text" id="s-pass" placeholder="Store Password">
                </div>
                <button class="btn-main" onclick="createStore()">🚀 Create & Launch Store</button>
            </div>
            <div class="card">
                <h2>🏢 Store Management List</h2>
                <div id="store-list" class="item-list"></div>
            </div>
        </div>

        <div id="tab-prods" class="section">
            <div class="card">
                <h2>➕ Add Master Product (Auto Real Photo)</h2>
                <div class="grid-form">
                    <input type="text" id="p-name" placeholder="Product Name (e.g. Fresh Tomato, Milk, Potato)">
                    <select id="p-cat">
                        <option value="Sabzi & Fruits">🥬 Sabzi & Fruits</option>
                        <option value="Dairy & Bread">🥛 Dairy & Bread</option>
                        <option value="Atta, Rice & Dal">🌾 Atta, Rice & Dal</option>
                        <option value="Snacks & Drinks">🥤 Snacks & Drinks</option>
                        <option value="Masala & Oil">🫙 Masala & Oil</option>
                    </select>
                    <input type="number" id="p-mrp" placeholder="MRP (₹) e.g. 60">
                    <input type="number" id="p-price" placeholder="Selling Price (₹) e.g. 40">
                    <input type="text" id="p-weight" placeholder="Weight/Pack (e.g. 1 kg, 500 g)">
                    <input type="text" id="p-img" placeholder="Image URL (Optional - Auto Real Photo if blank)">
                    <select id="p-store"><option value="ALL">Assign to ALL Stores</option></select>
                </div>
                <button class="btn-main" onclick="addMasterProduct()">⚡ Publish to Master Catalog</button>
            </div>
            <div class="card">
                <h2>📋 Master Catalog</h2>
                <div id="prod-list" class="item-list"></div>
            </div>
        </div>

        <div id="tab-orders" class="section">
            <div class="card">
                <h2>📦 Live Orders (Filtered by Top Store Selector)</h2>
                <div id="ord-list" class="item-list"></div>
            </div>
        </div>

        <div id="tab-riders" class="section">
            <div class="card">
                <h2>🛵 Registered & Online Riders</h2>
                <div id="rider-list" class="item-list"></div>
            </div>
        </div>
    </div>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcxcKM6AA20FA3ka0f1LKlMX8JLLqXODQ",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "jhatpat-22aa8",
            storageBucket: "jhatpat-22aa8.firebasestorage.app",
            messagingSenderId: "51391257177",
            appId: "1:51391257177:web:2537fdd28d123dd8d0ef48"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function verifyAdmin() {
            const p = document.getElementById('admin-pass').value.trim();
            if (p === "MOHIT@001") {
                document.getElementById('login-modal').style.display = 'none';
                localStorage.setItem('jhatpat_admin', 'MOHIT@001');
            } else {
                alert("❌ Incorrect Password! Please enter MOHIT@001");
            }
        }
        if (localStorage.getItem('jhatpat_admin') === 'MOHIT@001') {
            document.getElementById('login-modal').style.display = 'none';
        }

        function openTab(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function getAutoPhoto(name) {
            const n = name.toLowerCase();
            if (n.includes('tomato') || n.includes('tamatar')) return 'https://unsplash.com';
            if (n.includes('potato') || n.includes('aloo')) return 'https://unsplash.com';
            if (n.includes('onion') || n.includes('pyaz') || n.includes('kanda')) return 'https://unsplash.com';
            if (n.includes('banana') || n.includes('kela')) return 'https://unsplash.com';
            if (n.includes('apple') || n.includes('seb')) return 'https://unsplash.com';
            if (n.includes('milk') || n.includes('doodh')) return 'https://unsplash.com';
            if (n.includes('bread')) return 'https://unsplash.com';
            if (n.includes('rice') || n.includes('chawal')) return 'https://unsplash.com';
            if (n.includes('atta')) return 'https://unsplash.com';
            return 'https://unsplash.com?' + encodeURIComponent(name + ',grocery');
        }

        let allStores = {};
        let allOrders = [];

        function createStore() {
            const name = document.getElementById('s-name').value.trim();
            const area = document.getElementById('s-area').value.trim();
            const address = document.getElementById('s-addr').value.trim();
            const lat = parseFloat(document.getElementById('s-lat').value) || 19.2056;
            const lng = parseFloat(document.getElementById('s-lng').value) || 73.0954;
            const radius = Number(document.getElementById('s-rad').value) || 5;
            const manager = document.getElementById('s-mgr').value.trim();
            const phone = document.getElementById('s-phone').value.trim();
            const loginId = document.getElementById('s-id').value.trim();
            const password = document.getElementById('s-pass').value.trim();

            if (!name || !area || !loginId || !password) { alert("Store Name, Area, Login ID & Password are required!"); return; }

            const ref = db.ref('stores').push();
            ref.set({
                id: ref.key, name, area, address, lat, lng, radius, manager, phone, loginId, password, isOpen: true
            }).then(() => {
                alert("🎉 Dark Store Launched Successfully!");
                document.querySelectorAll('#tab-stores input').forEach(i => i.value = '');
            });
        }

        db.ref('stores').on('value', (snap) => {
            allStores = {};
            const list = document.getElementById('store-list');
            const pSel = document.getElementById('p-store');
            const aSel = document.getElementById('analytics-store-filter');
            list.innerHTML = '';
            pSel.innerHTML = '<option value="ALL">Assign to ALL Stores</option>';
            aSel.innerHTML = '<option value="ALL">📊 Global Analytics: ALL STORES</option>';

            snap.forEach((child) => {
                const s = child.val();
                allStores[s.id] = s;
                pSel.innerHTML += `<option value="${s.id}">${s.name} (${s.area})</option>`;
                aSel.innerHTML += `<option value="${s.id}">🏪 ${s.name} (${s.area})</option>`;
                list.innerHTML += `
                    <div class="list-card">
                        <span class="badge ${s.isOpen ? 'bg-open' : 'bg-closed'}">${s.isOpen ? 'OPEN (LIVE)' : 'CLOSED'}</span>
                        <h3 style="margin-top:6px;">${s.name}</h3>
                        <p style="font-size:12px;">📍 ${s.area} (${s.radius} KM)</p>
                        <p style="font-size:12px;">👤 ${s.manager} (${s.phone || ''})</p>
                        <p style="font-size:12px;background:#f3f4f6;padding:5px;margin-top:5px;">ID: <b>${s.loginId}</b> | Pass: <b>${s.password}</b></p>
                        <div class="act-row">
                            <button class="btn-s" style="background:#fef08a;" onclick="db.ref('stores/${s.id}').update({isOpen:${!s.isOpen}})">${s.isOpen ? 'Close Store' : 'Open Store'}</button>
                            <button class="btn-s" style="background:#ef4444;color:white;" onclick="if(confirm('Delete store?'))db.ref('stores/${s.id}').remove()">Delete</button>
                        </div>
                    </div>`;
            });
        });

        function addMasterProduct() {
            const name = document.getElementById('p-name').value.trim();
            const category = document.getElementById('p-cat').value;
            const mrp = Number(document.getElementById('p-mrp').value);
            const price = Number(document.getElementById('p-price').value);
            const weight = document.getElementById('p-weight').value.trim() || "1 Unit";
            const img = document.getElementById('p-img').value.trim() || getAutoPhoto(name);
            const assignedStore = document.getElementById('p-store').value;

            if (!name || !price) { alert("Product Name & Selling Price required!"); return; }
            const discount = mrp > price ? Math.round(((mrp - price) / mrp) * 100) : 0;
            const ref = db.ref('master_products').push();

            ref.set({
                id: ref.key, name, category, mrp: mrp || price, price, discount, weight, image: img, assignedStore
            }).then(() => {
                if (assignedStore === "ALL") {
                    Object.keys(allStores).forEach(stId => db.ref(`store_inventory/${stId}/${ref.key}`).set(true));
                } else {
                    db.ref(`store_inventory/${assignedStore}/${ref.key}`).set(true);
                }
                alert("✅ Product Published with Real Photo!");
                document.getElementById('p-name').value = '';
                document.getElementById('p-mrp').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-img').value = '';
            });
        }

        db.ref('master_products').on('value', (snap) => {
            const list = document.getElementById('prod-list');
            list.innerHTML = '';
            let c = 0;
            snap.forEach((child) => {
                c++;
                const i = child.val();
                list.innerHTML += `
                    <div class="list-card">
                        <img src="${i.image}">
                        <span class="badge bg-open">${i.discount}% OFF</span>
                        <h3 style="margin-top:6px;font-size:15px;">${i.name}</h3>
                        <p style="font-size:12px;color:#666;">${i.weight} • <b>₹${i.price}</b> <del>₹${i.mrp}</del></p>
                        <div class="act-row">
                            <button class="btn-s" style="background:#3b82f6;color:white;" onclick="const np=prompt('New Price:',${i.price});if(np)db.ref('master_products/${i.id}').update({price:Number(np)})">Edit Rate</button>
                            <button class="btn-s" style="background:#ef4444;color:white;" onclick="if(confirm('Delete?'))db.ref('master_products/${i.id}').remove()">Delete</button>
                        </div>
                    </div>`;
            });
            document.getElementById('stat-prd').innerText = c;
        });

        db.ref('orders').on('value', (snap) => {
            allOrders = [];
            snap.forEach(c => allOrders.push({ key: c.key, ...c.val() }));
            renderOrdersAndStats();
        });

        function renderOrdersAndStats() {
            const filterStore = document.getElementById('analytics-store-filter').value;
            const list = document.getElementById('ord-list');
            list.innerHTML = '';
            let rev = 0, count = 0;

            allOrders.forEach(o => {
                if (filterStore !== "ALL" && o.storeId !== filterStore) return;
                count++;
                rev += Number(o.total || 0);
                list.innerHTML += `
                    <div class="list-card">
                        <span class="badge bg-open">${o.status}</span>
                        <h3 style="margin-top:5px;">#${o.key.slice(-5).toUpperCase()} • ₹${o.total}</h3>
                        <p style="font-size:12px;">🏪 ${o.storeName || 'Store'}</p>
                        <p style="font-size:12px;">👤 ${o.customerName} (${o.phone})</p>
                        <p style="font-size:12px;color:#555;">📍 ${o.address}</p>
                    </div>`;
            });
            document.getElementById('stat-ord').innerText = count;
            document.getElementById('stat-rev').innerText = '₹' + rev;
        }

        db.ref('riders').on('value', (snap) => {
            const list = document.getElementById('rider-list');
            list.innerHTML = '';
            snap.forEach(c => {
                const r = c.val();
                list.innerHTML += `<div class="list-card"><span class="badge ${r.online?'bg-open':'bg-closed'}">${r.online?'ONLINE':'OFFLINE'}</span><h3 style="margin-top:6px;">🛵 ${r.name}</h3><p style="font-size:12px;">Zone: ${allStores[r.storeId]?.name || 'All Stores'}</p></div>`;
            });
        });
    </script>
</body>
</html>
