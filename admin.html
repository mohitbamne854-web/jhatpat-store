<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jhatpat Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
    <!-- Firebase SDKs (Compat v9/v10 for zero-build direct browser execution) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
      const firebaseConfig = {
        projectId: "jhatpat-22aa8",
        databaseURL: "https://jhatpat-22aa8-default-rtdb.firebaseio.com",
        authDomain: "jhatpat-22aa8.firebaseapp.com",
        storageBucket: "jhatpat-22aa8.appspot.com"
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
    </script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body>
  <!-- Password Gate (MOHIT@001) -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <span class="text-3xl font-extrabold text-emerald-600">⚡ Jhatpat Admin</span>
        <p class="text-xs text-gray-500 mt-1">Master Inventory & Order Control</p>
      </div>
      <form onsubmit="verifyAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Admin Password</label>
          <input type="password" id="adminPassInput" required placeholder="Enter Admin Password"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <p id="loginError" class="text-red-600 text-xs font-semibold hidden">Invalid Admin Password!</p>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
          Unlock Admin Panel
        </button>
      </form>
    </div>
  </div>

  <!-- Main Admin Dashboard -->
  <div id="adminDashboard" class="hidden min-h-screen pb-12">
    <header class="bg-slate-900 text-white shadow">
      <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-xl font-extrabold">⚡ Jhatpat Admin Panel</h1>
          <p class="text-xs text-slate-400">Firebase: jhatpat-22aa8 • Gallery Upload & Full Product Edit</p>
        </div>
        <div class="flex gap-2">
          <button onclick="openProductModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">
            + Add New Product
          </button>
          <button onclick="logoutAdmin()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold px-3 py-2.5 rounded-xl">
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6">
      <!-- Stats Bar -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border">
          <p class="text-xs text-gray-500 font-semibold">Total Products</p>
          <p id="statTotalProducts" class="text-2xl font-extrabold text-gray-800 mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border">
          <p class="text-xs text-gray-500 font-semibold">In Stock</p>
          <p id="statInStock" class="text-2xl font-extrabold text-emerald-600 mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border">
          <p class="text-xs text-gray-500 font-semibold">Out of Stock</p>
          <p id="statOutOfStock" class="text-2xl font-extrabold text-red-600 mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border">
          <p class="text-xs text-gray-500 font-semibold">Live Orders</p>
          <p id="statTotalOrders" class="text-2xl font-extrabold text-blue-600 mt-1">0</p>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border mb-6 flex flex-col sm:flex-row gap-3">
        <input type="text" id="adminSearch" oninput="renderAdminProducts()" placeholder="Search product by name or category..."
          class="flex-1 border rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        <select id="adminCatFilter" onchange="renderAdminProducts()" class="border rounded-xl px-4 py-2 text-sm bg-white">
          <option value="All">All Categories</option>
        </select>
      </div>

      <!-- Product Table / Cards -->
      <div id="adminProductList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>
  </div>

  <!-- Add / Full Edit Product Modal -->
  <div id="productModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-6 max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 id="modalTitle" class="text-lg font-bold text-gray-800">Add New Product</h2>
        <button onclick="closeProductModal()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
      </div>

      <form id="productForm" onsubmit="saveProduct(event)" class="space-y-3">
        <input type="hidden" id="editProdId" />

        <!-- Gallery Image Upload + Live Preview -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Product Photo (Gallery Upload or URL)</label>
          <div class="flex items-center gap-4">
            <img id="imagePreview" src="https://placehold.co/200x200/e2e8f0/475569?text=Preview"
              class="w-20 h-20 rounded-xl object-cover border bg-gray-50 shrink-0" />
            <div class="flex-1 space-y-2">
              <input type="file" id="galleryInput" accept="image/*" onchange="handleGalleryUpload(event)"
                class="block w-full text-xs text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer" />
              <input type="text" id="imageUrlInput" oninput="updatePreviewFromUrl()" placeholder="Or paste image URL here..."
                class="w-full border rounded-lg px-3 py-1.5 text-xs focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
          </div>
          <p id="uploadStatus" class="text-[11px] text-emerald-600 mt-1 hidden">Image compressed & ready!</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Product Name *</label>
            <input type="text" id="prodName" required placeholder="e.g., Amul Taaza Milk"
              class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Category *</label>
            <input type="text" id="prodCategory" required placeholder="e.g., Dairy, Snacks, Fruits"
              class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Selling Price (₹) *</label>
            <input type="number" id="prodPrice" required min="1" step="any" placeholder="50"
              class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">MRP (₹)</label>
            <input type="number" id="prodMrp" min="1" step="any" placeholder="60"
              class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Unit / Weight *</label>
            <input type="text" id="prodUnit" required placeholder="500 ml / 1 kg"
              class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Stock Quantity</label>
            <input type="number" id="prodStock" min="0" value="50"
              class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Availability Status</label>
            <select id="prodInStock" class="w-full border rounded-xl px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="true">In Stock (Active)</option>
              <option value="false">Out of Stock (Hidden/Disabled)</option>
            </select>
          </div>
        </div>

        <button type="submit" id="saveProdBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition mt-2">
          Save Product
        </button>
      </form>
    </div>
  </div>

  <script>
    const ADMIN_PASS = 'MOHIT@001';
    const PLACEHOLDER_IMG = 'https://placehold.co/200x200/e2e8f0/475569?text=No+Photo';
    let allProducts = [];
    let currentImageBase64 = '';

    // Check Session
    if (sessionStorage.getItem('jhatpat_admin_auth') === 'true') {
      showDashboard();
    }

    function verifyAdminLogin(e) {
      e.preventDefault();
      const val = document.getElementById('adminPassInput').value.trim();
      if (val === ADMIN_PASS) {
        sessionStorage.setItem('jhatpat_admin_auth', 'true');
        document.getElementById('loginError').classList.add('hidden');
        showDashboard();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('jhatpat_admin_auth');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      initFirebaseListeners();
    }

    function initFirebaseListeners() {
      db.ref('products').on('value', (snap) => {
        const data = snap.val() || {};
        allProducts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        updateStats();
        populateCategoryDropdown();
        renderAdminProducts();
      });

      db.ref('orders').on('value', (snap) => {
        const orders = snap.val() || {};
        document.getElementById('statTotalOrders').innerText = Object.keys(orders).length;
      });
    }

    function updateStats() {
      document.getElementById('statTotalProducts').innerText = allProducts.length;
      const inStockCount = allProducts.filter(p => p.inStock !== false && Number(p.stock ?? 1) > 0).length;
      document.getElementById('statInStock').innerText = inStockCount;
      document.getElementById('statOutOfStock').innerText = allProducts.length - inStockCount;
    }

    function populateCategoryDropdown() {
      const select = document.getElementById('adminCatFilter');
      const current = select.value;
      const cats = ['All', ...new Set(allProducts.map(p => p.category || 'General').filter(Boolean))];
      select.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
      if (cats.includes(current)) select.value = current;
    }

    function renderAdminProducts() {
      const q = document.getElementById('adminSearch').value.toLowerCase().trim();
      const cat = document.getElementById('adminCatFilter').value;
      const list = document.getElementById('adminProductList');

      const filtered = allProducts.filter(p => {
        const matchCat = cat === 'All' || (p.category || 'General') === cat;
        const matchQ = !q || (p.name || '').toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div class="col-span-full text-center py-12 bg-white rounded-2xl text-gray-500">No products found. Click "+ Add New Product" to start.</div>';
        return;
      }

      list.innerHTML = filtered.map(p => {
        const isAvailable = p.inStock !== false && Number(p.stock ?? 1) > 0;
        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border flex gap-3 items-start">
            <img src="${p.image || PLACEHOLDER_IMG}" onerror="this.src='${PLACEHOLDER_IMG}'"
              class="w-20 h-20 rounded-xl object-cover border bg-gray-50 shrink-0" />
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start gap-2">
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-600">${p.category || 'General'}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isAvailable ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">
                  ${isAvailable ? 'In Stock' : 'Out of Stock'}
                </span>
              </div>
              <h3 class="font-bold text-gray-900 text-sm mt-1 truncate">${p.name}</h3>
              <p class="text-xs text-gray-500">${p.unit || ''} • Stock: ${p.stock ?? 'N/A'}</p>
              <div class="mt-1">
                <span class="font-extrabold text-emerald-700 text-sm">₹${p.price}</span>
                ${p.mrp > p.price ? `<span class="text-xs text-gray-400 line-through ml-1">₹${p.mrp}</span>` : ''}
              </div>
              <div class="flex gap-2 mt-3">
                <button onclick="openEditModal('${p.id}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-1.5 rounded-lg transition">
                  Edit Full Details
                </button>
                <button onclick="deleteProduct('${p.id}', '${(p.name || '').replace(/'/g, "\\'")}')" class="px-3 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold py-1.5 rounded-lg transition">
                  Delete
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Compress & Convert Gallery Image to Base64 so Firebase Realtime DB stores it cleanly without Storage CORS errors
    function handleGalleryUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 480;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentImageBase64 = canvas.toDataURL('image/jpeg', 0.78);
          document.getElementById('imagePreview').src = currentImageBase64;
          document.getElementById('imageUrlInput').value = '';
          const statusEl = document.getElementById('uploadStatus');
          statusEl.innerText = 'Gallery photo loaded & optimized!';
          statusEl.classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updatePreviewFromUrl() {
      const url = document.getElementById('imageUrlInput').value.trim();
      if (url) {
        currentImageBase64 = url;
        document.getElementById('imagePreview').src = url;
        document.getElementById('uploadStatus').classList.add('hidden');
      }
    }

    function openProductModal() {
      document.getElementById('modalTitle').innerText = 'Add New Product';
      document.getElementById('productForm').reset();
      document.getElementById('editProdId').value = '';
      currentImageBase64 = '';
      document.getElementById('imagePreview').src = PLACEHOLDER_IMG;
      document.getElementById('uploadStatus').classList.add('hidden');
      document.getElementById('productModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const prod = allProducts.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('modalTitle').innerText = 'Edit Product: ' + prod.name;
      document.getElementById('editProdId').value = prod.id;
      document.getElementById('prodName').value = prod.name || '';
      document.getElementById('prodCategory').value = prod.category || '';
      document.getElementById('prodPrice').value = prod.price || '';
      document.getElementById('prodMrp').value = prod.mrp || '';
      document.getElementById('prodUnit').value = prod.unit || '';
      document.getElementById('prodStock').value = prod.stock !== undefined ? prod.stock : 50;
      document.getElementById('prodInStock').value = prod.inStock === false ? 'false' : 'true';
      document.getElementById('galleryInput').value = '';

      currentImageBase64 = prod.image || '';
      document.getElementById('imagePreview').src = currentImageBase64 || PLACEHOLDER_IMG;
      document.getElementById('imageUrlInput').value = (currentImageBase64 && !currentImageBase64.startsWith('data:')) ? currentImageBase64 : '';
      document.getElementById('uploadStatus').classList.add('hidden');

      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    async function saveProduct(e) {
      e.preventDefault();
      const btn = document.getElementById('saveProdBtn');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      const id = document.getElementById('editProdId').value || ('prod_' + Date.now());
      const price = Number(document.getElementById('prodPrice').value);
      const mrpVal = document.getElementById('prodMrp').value;
      const mrp = mrpVal ? Number(mrpVal) : price;
      const stock = Number(document.getElementById('prodStock').value || 0);
      const inStock = document.getElementById('prodInStock').value === 'true' && stock > 0;

      const payload = {
        name: document.getElementById('prodName').value.trim(),
        category: document.getElementById('prodCategory').value.trim(),
        price: price,
        mrp: mrp,
        unit: document.getElementById('prodUnit').value.trim(),
        stock: stock,
        inStock: inStock,
        image: currentImageBase64 || document.getElementById('imageUrlInput').value.trim() || PLACEHOLDER_IMG,
        updatedAt: Date.now()
      };

      try {
        await db.ref('products/' + id).update(payload);
        closeProductModal();
      } catch (err) {
        alert('Error saving product: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Product';
      }
    }

    async function deleteProduct(id, name) {
      if (!confirm(`Are you sure you want to delete "${name}"?`)) return;
      try {
        await db.ref('products/' + id).remove();
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    }
  </script>
</body>
</html>
