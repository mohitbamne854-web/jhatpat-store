<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhatpat - Delivery Partner App</title>
    <style>
        :root {
            --yellow: #f8cb46;
            --green: #0c831f;
            --dark: #1c1c1c;
            --bg: #f4f6fb;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 50px; }

        header {
            background: var(--green);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 20px; font-weight: 800; }
        .earn-badge { background: var(--yellow); color: var(--dark); padding: 5px 12px; border-radius: 20px; font-weight: 800; font-size: 13px; }

        .container { max-width: 650px; margin: 16px auto; padding: 0 14px; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid var(--yellow);
        }
        .status-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            background: #dcfce7;
            color: #166534;
        }
        .loc-box {
            background: #f9fafb;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
            line-height: 1.5;
        }
        .btn-row { display: flex; gap: 10px; margin-top: 12px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-pick { background: #2563eb; color: white; }
        .btn-deliv { background: var(--green); color: white; }
        .btn-call { background: #eee; color: var(--dark); text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; }

        /* Login Screen */
        #rider-login {
            position: fixed;
            inset: 0;
            background: var(--green);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .login-box {
            background: white;
            padding: 28px;
            border-radius: 15px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--dark);
            color: var(--yellow);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Rider Duty Login -->
    <div id="rider-login">
        <div class="login-box">
            <h2 style="margin-bottom:5px;">🛵 Jhatpat Rider</h2>
            <p style="font-size:13px; color:#666; margin-bottom:18px;">Apna naam aur area select karke duty shuru karein</p>
            <input type="text" id="rider-name" placeholder="Rider Name (e.g., Rahul)">
            <select id="rider-store-select">
                <option value="ALL">All Dark Stores</option>
            </select>
            <button onclick="startDuty()">Go Online & Start Delivery</button>
        </div>
    </div>

    <header>
        <div>
            <h1 id="rider-header-name">🛵 Rider</h1>
            <small id="rider-zone" style="opacity:0.9;">Online • Ready for Orders</small>
        </div>
        <div class="earn-badge">Delivered: <span id="deliv-count">0</span></div>
    </header>

    <div class="container">
        <h3 style="margin-bottom:12px; font-size:16px; color:#444;">📦 Available & Active Deliveries</h3>
        <div id="rider-orders-list">
            <p style="color:#666;">Waiting for packed orders...</p>
        </div>
    </div>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcxcKM6AA20FA3ka0f1LKlMX8JLLqXODQ",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "jhatpat-22aa8",
            storageBucket: "jhatpat-22aa8.firebasestorage.app",
            messagingSenderId: "51391257177",
            appId: "1:51391257177:web:2537fdd28d123dd8d0ef48"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let riderName = "";
        let riderStoreId = "ALL";

        // Load Stores in dropdown
        db.ref('stores').on('value', (snapshot) => {
            const sel = document.getElementById('rider-store-select');
            sel.innerHTML = '<option value="ALL">All Dark Stores</option>';
            snapshot.forEach((child) => {
                const st = child.val();
                sel.innerHTML += `<option value="${st.id}">${st.name} (${st.area})</option>`;
            });
        });

        function startDuty() {
            riderName = document.getElementById('rider-name').value.trim();
            riderStoreId = document.getElementById('rider-store-select').value;

            if (!riderName) {
                alert("Kripya apna naam dalein!");
                return;
            }

            document.getElementById('rider-login').style.display = 'none';
            document.getElementById('rider-header-name').innerText = "🛵 " + riderName;
            listenOrders();
        }

        function listenOrders() {
            db.ref('orders').on('value', (snapshot) => {
                const list = document.getElementById('rider-orders-list');
                list.innerHTML = '';
                let activeCount = 0;
                let deliveredCount = 0;

                snapshot.forEach((child) => {
                    const ord = child.val();
                    if (ord.status === 'DELIVERED' && ord.riderName === riderName) {
                        deliveredCount++;
                    }

                    const matchesStore = (riderStoreId === "ALL" || ord.storeId === riderStoreId || ord.storeId === "ALL");
                    if (matchesStore && ord.status !== 'DELIVERED') {
                        activeCount++;
                        list.innerHTML += `
                            <div class="card">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <strong>Order #${child.key.slice(-5).toUpperCase()}</strong>
                                    <span class="status-tag">${ord.status}</span>
                                </div>
                                <div class="loc-box">
                                    <div>🏪 <b>Pickup:</b> ${ord.storeName || 'Jhatpat Dark Store'} (${ord.storeAddress || ''})</div>
                                    <div style="margin-top:5px;">🏠 <b>Drop:</b> ${ord.customerName} — ${ord.address}</div>
                                    <div style="margin-top:5px; color:var(--green); font-weight:bold;">💰 Collect Cash: ₹${ord.total}</div>
                                </div>
                                <div class="btn-row">
                                    <a href="tel:${ord.phone}" class="btn btn-call">📞 Call</a>
                                    ${ord.status !== 'OUT FOR DELIVERY' 
                                        ? `<button class="btn btn-pick" onclick="updateDelivery('${child.key}', 'OUT FOR DELIVERY')">Pick Up Order</button>`
                                        : `<button class="btn btn-deliv" onclick="updateDelivery('${child.key}', 'DELIVERED')">Mark Delivered ✅</button>`
                                    }
                                </div>
                            </div>
                        `;
                    }
                });

                document.getElementById('deliv-count').innerText = deliveredCount;
                if (activeCount === 0) {
                    list.innerHTML = '<p style="text-align:center; color:#777; padding:30px;">Abhi koi delivery order pending nahi hai.</p>';
                }
            });
        }

        function updateDelivery(orderId, newStatus) {
            db.ref('orders/' + orderId).update({
                status: newStatus,
                riderName: riderName
            }).then(() => {
                if (newStatus === 'DELIVERED') {
                    alert("🎉 Order Delivered! Cash collect karna na bhulein.");
                }
            });
        }
    </script>
</body>
</html>
