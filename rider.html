<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jhatpat — Rider Fleet Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #090D16;
    --card: #111827;
    --card2: #1F2937;
    --green: #22C55E;
    --yellow: #FACC15;
    --text: #F9FAFB;
    --muted: #9CA3AF;
    --border: #1F2937;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #030712;
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .shell {
    width: 100%;
    max-width: 480px;
    background: var(--bg);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .lock-screen {
    position: fixed;
    inset: 0;
    background: #030712;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 999;
  }
  .lock-card {
    background: var(--card);
    border: 1px solid #374151;
    border-radius: 20px;
    padding: 28px 22px;
    width: 100%;
    max-width: 390px;
  }
  .header {
    background: var(--card);
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .wallet-card {
    margin: 14px 16px;
    background: linear-gradient(135deg, #065F46, #047857);
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  input {
    width: 100%;
    background: var(--card2);
    color: #fff;
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    margin-top: 10px;
    outline: none;
  }
  .task-card {
    margin: 0 16px 12px;
    background: var(--card);
    border: 1px solid #374151;
    border-radius: 16px;
    padding: 15px;
  }
  .btn {
    padding: 11px 14px;
    border-radius: 11px;
    border: none;
    font-family: inherit;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
  }
  .btn-green { background: var(--green); color: #052E16; }
  .btn-yellow { background: var(--yellow); color: #111; }
  .btn-blue { background: #2563EB; color: #fff; }
  .btn-dark { background: #1F2937; color: #fff; border: 1px solid #374151; }
  .btn-red { background: #DC2626; color: #fff; }
</style>
</head>
<body>

<div class="lock-screen" id="riderLockScreen">
  <div class="lock-card">
    <div style="font-size:12px;color:var(--yellow);font-weight:800;">⚡ JHATPAT FLEET</div>
    <h2 style="font-size:22px;margin-top:4px;">Rider Partner Login</h2>
    <p style="font-size:12px;color:var(--muted);margin-top:4px;">Apna naam aur rider password daal kar duty start karein.</p>
    <input type="text" id="loginRiderName" placeholder="Your Rider Name (e.g. Rahul)">
    <input type="password" id="loginRiderPass" placeholder="Rider Password (RIDER@001)" onkeydown="if(event.key==='Enter') unlockRider()">
    <button class="btn btn-green" style="width:100%;margin-top:14px;padding:13px;" onclick="unlockRider()">Start Duty ▸</button>
  </div>
</div>

<div class="shell" id="riderMainApp" style="display:none;">
  <header class="header">
    <div>
      <div style="font-size:11px;color:var(--yellow);font-weight:800;">⚡ JHATPAT FLEET</div>
      <div style="font-size:16px;font-weight:800;" id="headerRiderName">Rider Partner</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-yellow" style="padding:6px 10px;font-size:11px;" onclick="testRiderBeep()">🔔 Ring</button>
      <button class="btn btn-red" style="padding:6px 10px;font-size:11px;" onclick="logoutRider()">Lock</button>
    </div>
  </header>

  <div class="wallet-card">
    <div>
      <div style="font-size:11px;opacity:0.85;font-weight:700;">RIDER EARNINGS WALLET</div>
      <div style="font-size:26px;font-weight:800;margin-top:2px;" id="riderWalletAmt">₹0</div>
      <div style="font-size:11px;opacity:0.85;margin-top:2px;" id="riderTripCount">0 Completed Drops (₹35/drop)</div>
    </div>
    <div style="font-size:36px;">🛵</div>
  </div>

  <div style="padding:4px 16px 10px;display:flex;justify-content:space-between;align-items:center;">
    <h3 style="font-size:15px;">Live Dispatch & Drops</h3>
    <span style="font-size:12px;color:var(--green);font-weight:700;" id="activeDropCount">0 tasks</span>
  </div>

  <div id="riderTasksList"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDummyKeyForRTDBAccess",
  authDomain: "jhatpat-22aa8.firebaseapp.com",
  databaseURL: "https://jhatpat-22aa8-default-rtdb.firebaseio.com",
  projectId: "jhatpat-22aa8",
  storageBucket: "jhatpat-22aa8.appspot.com",
  messagingSenderId: "100000000000",
  appId: "1:100000000000:web:jhatpat22aa8"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let ordersMap = {};
let knownReadyIds = new Set();
let initialLoadDone = false;
const PER_DROP_PAY = 35;

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg, type = 'dark') {
  let box = document.getElementById('toastBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toastBox';
    box.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:90%;max-width:360px;';
    document.body.appendChild(box);
  }
  const el = document.createElement('div');
  const bg = type === 'error' ? '#dc2626' : (type === 'success' ? '#15803d' : '#18181b');
  el.style.cssText = `background:${bg};color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 10px 25px rgba(0,0,0,0.25);text-align:center;`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function playRiderBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 1100].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
      gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.14);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.14);
      osc.stop(ctx.currentTime + idx * 0.14 + 0.36);
    });
  } catch (e) {}
}

function testRiderBeep() {
  playRiderBeep();
  showToast('🔔 Rider Alert Sound Active!', 'success');
}

if (sessionStorage.getItem('jhatpat_rider_unlocked') === '1') {
  bootRiderApp();
}

function unlockRider() {
  const name = document.getElementById('loginRiderName').value.trim();
  const pass = document.getElementById('loginRiderPass').value.trim();
  if (!name) return showToast('Apna Rider Name dalein!', 'error');
  if (pass !== 'RIDER@001') return showToast('❌ Galat Rider Password!', 'error');

  localStorage.setItem('jhatpat_rider_name', name);
  sessionStorage.setItem('jhatpat_rider_unlocked', '1');
  bootRiderApp();
}

function logoutRider() {
  sessionStorage.removeItem('jhatpat_rider_unlocked');
  location.reload();
}

function bootRiderApp() {
  const rName = localStorage.getItem('jhatpat_rider_name') || 'Rider Partner';
  document.getElementById('headerRiderName').textContent = `🛵 ${rName}`;
  document.getElementById('riderLockScreen').style.display = 'none';
  document.getElementById('riderMainApp').style.display = 'block';

  db.ref('orders').on('value', snap => {
    ordersMap = snap.val() || {};
    const readyOrders = Object.values(ordersMap).filter(o => o && (o.status === 'PACKING' || o.status === 'OUT_FOR_DELIVERY'));
    if (initialLoadDone) {
      const hasNewReady = readyOrders.some(o => !knownReadyIds.has(o.orderId));
      if (hasNewReady) {
        playRiderBeep();
        showToast('🚨 NAYA ORDER PICKUP KE LIYE READY HAI!', 'success');
      }
    }
    knownReadyIds = new Set(readyOrders.map(o => o.orderId));
    initialLoadDone = true;
    renderRiderTasks();
  });
}

function renderRiderTasks() {
  const listEl = document.getElementById('riderTasksList');
  const allOrders = Object.values(ordersMap).filter(Boolean);
  const myName = (localStorage.getItem('jhatpat_rider_name') || '').toLowerCase();

  const delivered = allOrders.filter(o => o.status === 'DELIVERED' && (!o.riderName || o.riderName.toLowerCase() === myName));
  document.getElementById('riderTripCount').textContent = `${delivered.length} Completed Drops (₹${PER_DROP_PAY}/drop)`;
  document.getElementById('riderWalletAmt').textContent = `₹${(delivered.length * PER_DROP_PAY).toLocaleString('en-IN')}`;

  const activeTasks = allOrders
    .filter(o => o.status === 'PACKING' || o.status === 'OUT_FOR_DELIVERY')
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  document.getElementById('activeDropCount').textContent = `${activeTasks.length} tasks`;

  if (activeTasks.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:36px 20px;color:#9CA3AF;">Abhi koi active delivery nahi hai. Naye order ka intezaar karein...</div>';
    return;
  }

  listEl.innerHTML = activeTasks.map(o => {
    const mapsQuery = encodeURIComponent(`${o.customerAddress}, ${o.city || ''}`);
    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;
    const isOut = o.status === 'OUT_FOR_DELIVERY';
    const isCod = (o.paymentMethod || '').toUpperCase().includes('COD') || (o.paymentMethod || '').toUpperCase().includes('CASH');
    return `
      <div class="task-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:800;font-size:15px;">#${escapeHtml(o.orderId)}</span>
          <span style="font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px;background:${isOut ? '#1E3A8A' : '#78350F'};color:#fff;">
            ${isOut ? '🛵 OUT FOR DELIVERY' : '📦 READY AT STORE'}
          </span>
        </div>

        <div style="margin-top:10px;font-size:13px;line-height:1.5;">
          <div><strong>Customer:</strong> ${escapeHtml(o.customerName)}</div>
          <div style="color:#D1D5DB;margin-top:3px;">📍 ${escapeHtml(o.customerAddress)}</div>
          <div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:${isCod ? '#450A0A' : '#064E3B'};color:${isCod ? '#FCA5A5' : '#6EE7B7'};font-weight:800;font-size:12px;">
            ${isCod ? `💵 CASH LENA HAI: ₹${o.totalAmount}` : `✅ PAID ONLINE (₹${o.totalAmount})`}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
          <a href="tel:${escapeHtml(o.customerPhone)}" class="btn btn-dark">📞 Call Customer</a>
          <a href="${mapsUrl}" target="_blank" class="btn btn-blue">🗺️ Google Maps</a>
        </div>

        <div style="margin-top:8px;">
          ${!isOut
            ? `<button class="btn btn-yellow" style="width:100%;" onclick="riderUpdateOrder('${o.orderId}','OUT_FOR_DELIVERY')">📦 Order Picked Up</button>`
            : `<button class="btn btn-green" style="width:100%;" onclick="riderUpdateOrder('${o.orderId}','DELIVERED')">✅ Mark Delivered (+₹35)</button>`
          }
        </div>
      </div>
    `;
  }).join('');
}

function riderUpdateOrder(orderId, status) {
  const riderName = localStorage.getItem('jhatpat_rider_name') || 'Jhatpat Rider';
  db.ref('orders/' + orderId).update({
    status,
    riderName,
    updatedAt: Date.now()
  }).then(() => {
    showToast(status === 'DELIVERED' ? '🎉 Drop Completed! +₹35 wallet mein jud gaye' : '🛵 Order Picked Up! Customer ke address par jaayein', 'success');
  });
}
</script>
</body>
</html>
