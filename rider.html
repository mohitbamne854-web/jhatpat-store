<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jhatpat Rider App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
    <!-- Firebase SDKs (Compat v9/v10 for zero-build direct browser execution) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
      const firebaseConfig = {
        projectId: "jhatpat-22aa8",
        databaseURL: "https://jhatpat-22aa8-default-rtdb.firebaseio.com",
        authDomain: "jhatpat-22aa8.firebaseapp.com",
        storageBucket: "jhatpat-22aa8.appspot.com"
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
    </script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <!-- Password-Only Gate (RIDER@001 — No Zone Dropdown) -->
  <div id="riderLoginScreen" class="min-h-screen flex items-center justify-center p-4 bg-orange-950">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <span class="text-3xl font-extrabold text-orange-600">🛵 Jhatpat Rider</span>
        <p class="text-xs text-gray-500 mt-1">Direct Delivery Partner Login</p>
      </div>
      <form onsubmit="verifyRiderLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Rider Password</label>
          <input type="password" id="riderPassInput" required placeholder="Enter Rider Password"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 outline-none" />
        </div>
        <p id="riderLoginError" class="text-red-600 text-xs font-semibold hidden">Invalid Rider Password!</p>
        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow transition">
          Start Riding
        </button>
      </form>
    </div>
  </div>

  <!-- Rider Dashboard -->
  <div id="riderDashboard" class="hidden min-h-screen pb-12">
    <header class="bg-orange-600 text-white shadow">
      <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-extrabold">🛵 Jhatpat Delivery Partner</h1>
          <p class="text-xs text-orange-100">All Live Deliveries • Direct Access</p>
        </div>
        <button onclick="logoutRider()" class="bg-orange-800 hover:bg-orange-900 text-xs font-semibold px-3 py-2 rounded-xl">
          Logout
        </button>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6">
      <!-- Tabs -->
      <div class="flex gap-2 mb-4">
        <button onclick="setRiderTab('Available')" id="rTabAvailable" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-orange-600 text-white shadow">
          Active / Ready Deliveries
        </button>
        <button onclick="setRiderTab('Completed')" id="rTabCompleted" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-gray-700 border">
          Delivered History
        </button>
      </div>

      <div id="riderOrdersList" class="space-y-4"></div>
    </main>
  </div>

  <script>
    const RIDER_PASS = 'RIDER@001';
    let riderOrders = [];
    let activeTab = 'Available';

    if (sessionStorage.getItem('jhatpat_rider_auth') === 'true') {
      unlockRider();
    }

    function verifyRiderLogin(e) {
      e.preventDefault();
      const val = document.getElementById('riderPassInput').value.trim();
      if (val === RIDER_PASS) {
        sessionStorage.setItem('jhatpat_rider_auth', 'true');
        document.getElementById('riderLoginError').classList.add('hidden');
        unlockRider();
      } else {
        document.getElementById('riderLoginError').classList.remove('hidden');
      }
    }

    function logoutRider() {
      sessionStorage.removeItem('jhatpat_rider_auth');
      location.reload();
    }

    function unlockRider() {
      document.getElementById('riderLoginScreen').classList.add('hidden');
      document.getElementById('riderDashboard').classList.remove('hidden');
      listenRiderOrders();
    }

    function listenRiderOrders() {
      db.ref('orders').on('value', (snap) => {
        const data = snap.val() || {};
        riderOrders = Object.keys(data)
          .map(key => ({ id: key, ...data[key] }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        renderRiderOrders();
      });
    }

    function setRiderTab(tab) {
      activeTab = tab;
      document.getElementById('rTabAvailable').className = tab === 'Available'
        ? 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-orange-600 text-white shadow'
        : 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-gray-700 border';
      document.getElementById('rTabCompleted').className = tab === 'Completed'
        ? 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-orange-600 text-white shadow'
        : 'flex-1 py-2.5 rounded-xl text-xs font-bold bg-white text-gray-700 border';
      renderRiderOrders();
    }

    function renderRiderOrders() {
      const list = document.getElementById('riderOrdersList');
      const filtered = riderOrders.filter(o => {
        if (activeTab === 'Available') {
          return o.status !== 'Delivered' && o.status !== 'Cancelled';
        }
        return o.status === 'Delivered';
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center text-gray-500 border">No ${activeTab.toLowerCase()} deliveries found.</div>`;
        return;
      }

      list.innerHTML = filtered.map(o => `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-200">
          <div class="flex justify-between items-start border-b pb-3 mb-3">
            <div>
              <span class="font-extrabold text-gray-900 text-base">#${o.orderId}</span>
              <span class="ml-2 text-xs font-bold px-2.5 py-0.5 rounded-full ${
                o.status === 'Out for Delivery' ? 'bg-blue-100 text-blue-700' :
                o.status === 'Ready for Pickup' ? 'bg-emerald-100 text-emerald-700' :
                o.status === 'Delivered' ? 'bg-gray-100 text-gray-700' : 'bg-amber-100 text-amber-700'
              }">${o.status}</span>
              <h3 class="font-bold text-gray-800 text-sm mt-2">${o.customerName}</h3>
              <p class="text-xs text-gray-600 mt-0.5">${o.customerAddress}</p>
            </div>
            <div class="text-right">
              <p class="font-extrabold text-orange-600 text-lg">₹${o.totalAmount}</p>
              <p class="text-[11px] font-semibold text-gray-500">${o.paymentMode || 'COD'}</p>
            </div>
          </div>

          <div class="text-xs text-gray-600 mb-4">
            <strong>Items:</strong> ${(o.items || []).map(i => `${i.name} (x${i.qty})`).join(', ')}
          </div>

          <div class="flex flex-wrap gap-2">
            <a href="tel:${o.customerPhone}" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold px-4 py-2.5 rounded-xl">
              📞 Call Customer
            </a>
            ${o.status !== 'Out for Delivery' && o.status !== 'Delivered' ? `
              <button onclick="riderUpdateStatus('${o.orderId}', 'Out for Delivery')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">
                Pick Up & Start Delivery
              </button>
            ` : ''}
            ${o.status === 'Out for Delivery' ? `
              <button onclick="riderUpdateStatus('${o.orderId}', 'Delivered')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">
                ✓ Mark as Delivered
              </button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    async function riderUpdateStatus(orderId, status) {
      try {
        await db.ref('orders/' + orderId).update({
          status: status,
          updatedAt: Date.now()
        });
      } catch (err) {
        alert('Failed to update delivery status: ' + err.message);
      }
    }
  </script>
</body>
</html>
