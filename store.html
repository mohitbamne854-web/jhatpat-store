<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jhatpat — Dark Store Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #F1F5F9;
    --dark: #0F172A;
    --green: #0C831F;
    --yellow: #F8CB46;
    --border: #E2E8F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #0F172A; }

  /* Auth & KYC Screen */
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(135deg, #0F172A, #1E293B);
  }
  .auth-card {
    background: #fff; width: 100%; max-width: 440px; border-radius: 22px; padding: 26px; box-shadow: 0 25px 50px rgba(0,0,0,0.35);
  }
  .auth-tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #F1F5F9; padding: 5px; border-radius: 12px; margin: 16px 0;
  }
  .auth-tab {
    padding: 9px; border: none; border-radius: 9px; font-weight: 800; font-size: 13px; cursor: pointer; background: transparent;
  }
  .auth-tab.active { background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-family: inherit; font-size: 13px; margin-bottom: 10px;
  }
  .btn {
    padding: 11px 16px; border-radius: 10px; border: none; font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .btn-green { background: var(--green); color: #fff; }
  .btn-yellow { background: var(--yellow); color: #111; }
  .btn-dark { background: #0F172A; color: #fff; }
  .btn-red { background: #DC2626; color: #fff; }

  /* Terminal UI */
  .topbar {
    background: #0F172A; color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
  }
  .container { max-width: 1150px; margin: 0 auto; padding: 18px; }
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px;
  }
  .stat-card {
    background: #fff; border-radius: 14px; padding: 15px; border: 1px solid var(--border);
  }
  .panel-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .p-tab {
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .p-tab.active { background: #0F172A; color: #fff; }
  .order-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px;
  }
  .order-card {
    background: #fff; border-radius: 16px; padding: 16px; border: 2px solid var(--border);
  }
  .order-card.new-alert { border-color: #F59E0B; box-shadow: 0 0 0 4px rgba(245,158,11,0.18); }
  .stock-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px;
  }
  .stock-item {
    background: #fff; border-radius: 12px; padding: 10px 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
</style>
</head>
<body>

<!-- Login & Seller KYC Screen -->
<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="background:#F8CB46;padding:4px 10px;border-radius:8px;font-weight:800;">⚡ JHATPAT</span>
      <strong>Dark Store Partner Portal</strong>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLoginBtn" onclick="toggleAuthMode('login')">🔐 Store Login</button>
      <button class="auth-tab" id="tabKycBtn" onclick="toggleAuthMode('kyc')">🪪 New Seller KYC</button>
    </div>

    <!-- Store Terminal Login -->
    <div id="loginFormBox">
      <p style="font-size:12px;color:#64748B;margin-bottom:12px;">Enter exact Store ID & Store Password issued by Admin or approved KYC.</p>
      <input type="text" id="loginStoreId" placeholder="Exact Store ID (e.g. JHT-MUM-01)">
      <input type="password" id="loginStorePass" placeholder="Exact Store Password" onkeydown="if(event.key==='Enter') loginDarkStore()">
      <button class="btn btn-green" style="width:100%;" onclick="loginDarkStore()">Login to Dark Store Terminal ▸</button>
    </div>

    <!-- Simple Seller KYC Registration Form -->
    <div id="kycFormBox" style="display:none;">
      <p style="font-size:12px;color:#64748B;margin-bottom:10px;">Apply to become a Jhatpat Dark Store Partner (88% payout on every order).</p>
      <input type="text" id="kycStoreName" placeholder="Dark Store / Shop Name *">
      <input type="text" id="kycOwnerName" placeholder="Owner Full Name *">
      <input type="tel" id="kycPhone" placeholder="10-Digit Mobile Number *" maxlength="10">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <input type="text" id="kycCity" placeholder="City *">
        <input type="text" id="kycArea" placeholder="Area / Locality *">
      </div>
      <input type="text" id="kycDesiredId" placeholder="Choose Your Store ID (e.g. JHT-IND-01) *">
      <input type="text" id="kycDesiredPass" placeholder="Create Your Store Password *">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <input type="text" id="kycFssai" placeholder="FSSAI No. (Optional)">
        <input type="text" id="kycPan" placeholder="PAN No. (Optional)">
      </div>
      <button class="btn btn-yellow" style="width:100%;" onclick="submitSellerKyc()">Submit KYC for 1-Tap Approval ▸</button>
    </div>
  </div>
</div>

<!-- Main Dark Store Terminal -->
<div id="terminalApp" style="display:none;">
  <header class="topbar">
    <div>
      <div style="font-size:11px;color:#94A3B8;font-weight:700;">DARK STORE TERMINAL</div>
      <div style="font-size:17px;font-weight:800;" id="termStoreTitle">Store Name</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-yellow" onclick="testChime()">🔔 Test Chime</button>
      <button class="btn btn-green" id="storeOpenToggleBtn" onclick="toggleStoreOpenStatus()">🟢 Store OPEN</button>
      <button class="btn btn-red" onclick="logoutStore()">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- 88% Payout & Metrics -->
    <div class="stats-row">
      <div class="stat-card">
        <div style="font-size:12px;color:#64748B;font-weight:700;">ACTIVE QUEUE</div>
        <div style="font-size:24px;font-weight:800;margin-top:4px;" id="stActiveCount">0</div>
      </div>
      <div class="stat-card">
        <div style="font-size:12px;color:#64748B;font-weight:700;">STORE GROSS SALES</div>
        <div style="font-size:24px;font-weight:800;margin-top:4px;" id="stGrossSales">₹0</div>
      </div>
      <div class="stat-card">
        <div style="font-size:12px;color:#64748B;font-weight:700;">YOUR 88% NET PAYOUT</div>
        <div style="font-size:24px;font-weight:800;margin-top:4px;color:#0C831F;" id="stNetPayout">₹0</div>
      </div>
    </div>

    <div class="panel-tabs">
      <button class="p-tab active" onclick="switchTermTab('queueView', this)">📦 Live Packing Queue</button>
      <button class="p-tab" onclick="switchTermTab('stockView', this)">🥦 Local Stock Toggle</button>
    </div>

    <!-- Packing Queue -->
    <div id="queueView">
      <div class="order-grid" id="storeOrdersGrid"></div>
    </div>

    <!-- Local Stock Toggle -->
    <div id="stockView" style="display:none;">
      <input type="text" id="storeStockSearch" placeholder="Search item to mark In Stock / Out of Stock..." style="max-width:340px;background:#fff;" oninput="renderStoreStock()">
      <div class="stock-grid" id="storeStockGrid"></div>
    </div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDummyKeyForRTDBAccess",
  authDomain: "jhatpat-22aa8.firebaseapp.com",
  databaseURL: "https://jhatpat-22aa8-default-rtdb.firebaseio.com",
  projectId: "jhatpat-22aa8",
  storageBucket: "jhatpat-22aa8.appspot.com",
  messagingSenderId: "100000000000",
  appId: "1:100000000000:web:jhatpat22aa8"
};
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showToast(msg, type = 'dark') {
  let box = document.getElementById('toastBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toastBox';
    box.style.cssText = 'position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:380px;';
    document.body.appendChild(box);
  }
  const el = document.createElement('div');
  const bg = type === 'error' ? '#dc2626' : (type === 'success' ? '#15803d' : '#18181b');
  el.style.cssText = `background:${bg};color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.25);text-align:center;transition:opacity 0.25s;`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 2800);
}


let activeStoreId = sessionStorage.getItem('jhatpat_term_store_id') || '';
let activeStoreObj = null;
let storeOrders = {};
let allProducts = {};
let knownOrderIds = new Set();
let initialLoadDone = false;

if (activeStoreId) {
  verifyAndBootStore(activeStoreId, sessionStorage.getItem('jhatpat_term_store_pass') || '');
}

function toggleAuthMode(mode) {
  document.getElementById('loginFormBox').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('kycFormBox').style.display = mode === 'kyc' ? 'block' : 'none';
  document.getElementById('tabLoginBtn').classList.toggle('active', mode === 'login');
  document.getElementById('tabKycBtn').classList.toggle('active', mode === 'kyc');
}

function loginDarkStore() {
  const id = document.getElementById('loginStoreId').value.trim();
  const pass = document.getElementById('loginStorePass').value.trim();
  if (!id || !pass) return showToast('Enter both Store ID and Store Password!', 'error');
  verifyAndBootStore(id, pass);
}

function verifyAndBootStore(storeId, password) {
  db.ref('stores/' + storeId).once('value', snap => {
    const s = snap.val();
    if (!s || String(s.password) !== String(password)) {
      sessionStorage.removeItem('jhatpat_term_store_id');
      sessionStorage.removeItem('jhatpat_term_store_pass');
      showToast('Invalid Store ID or Password! Check with Admin.', 'error');
      return;
    }
    activeStoreId = storeId;
    activeStoreObj = s;
    sessionStorage.setItem('jhatpat_term_store_id', storeId);
    sessionStorage.setItem('jhatpat_term_store_pass', password);

    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('terminalApp').style.display = 'block';
    bootTerminalListeners();
  });
}

function logoutStore() {
  sessionStorage.removeItem('jhatpat_term_store_id');
  sessionStorage.removeItem('jhatpat_term_store_pass');
  location.reload();
}

function submitSellerKyc() {
  const storeName = document.getElementById('kycStoreName').value.trim();
  const ownerName = document.getElementById('kycOwnerName').value.trim();
  const phone = document.getElementById('kycPhone').value.trim();
  const city = document.getElementById('kycCity').value.trim();
  const area = document.getElementById('kycArea').value.trim();
  const desiredStoreId = document.getElementById('kycDesiredId').value.trim().replace(/[.#$\[\]]/g, '_');
  const desiredPassword = document.getElementById('kycDesiredPass').value.trim();
  const fssai = document.getElementById('kycFssai').value.trim();
  const pan = document.getElementById('kycPan').value.trim();

  if (!storeName || !ownerName || phone.length < 10 || !city || !area || !desiredStoreId || !desiredPassword) {
    showToast('Please fill all required KYC fields!', 'error');
    return;
  }

  const kycId = 'KYC_' + Date.now();
  db.ref('seller_kyc/' + kycId).set({
    kycId, storeName, ownerName, phone, city, area, desiredStoreId, desiredPassword, fssai, pan, status: 'PENDING', submittedAt: Date.now()
  }).then(() => {
    ['kycStoreName','kycOwnerName','kycPhone','kycCity','kycArea','kycDesiredId','kycDesiredPass','kycFssai','kycPan'].forEach(i => document.getElementById(i).value = '');
    toggleAuthMode('login');
    document.getElementById('loginStoreId').value = desiredStoreId;
    showToast('KYC Submitted! Login once Admin clicks 1-Tap Approve.', 'success');
  });
}

function playOrderChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [587.33, 880, 1174.66];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
      gain.gain.setValueAtTime(0.22, ctx.currentTime + idx * 0.14);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.14);
      osc.stop(ctx.currentTime + idx * 0.14 + 0.36);
    });
  } catch (e) {}
}

function testChime() {
  playOrderChime();
  showToast('🔔 Audio Chime Active!', 'success');
}

function bootTerminalListeners() {
  db.ref('stores/' + activeStoreId).on('value', snap => {
    const s = snap.val();
    if (!s) return logoutStore();
    activeStoreObj = s;
    document.getElementById('termStoreTitle').textContent = `${s.name} (${s.storeId}) • ${s.city}`;
    const isOpen = s.isOpen !== false;
    const btn = document.getElementById('storeOpenToggleBtn');
    btn.textContent = isOpen ? '🟢 Store OPEN' : '🔴 Store CLOSED';
    btn.className = 'btn ' + (isOpen ? 'btn-green' : 'btn-red');
  });

  db.ref('orders').orderByChild('storeId').equalTo(activeStoreId).on('value', snap => {
    storeOrders = snap.val() || {};
    const ids = Object.keys(storeOrders);
    if (initialLoadDone) {
      const hasNew = ids.some(id => !knownOrderIds.has(id) && storeOrders[id].status === 'PLACED');
      if (hasNew) {
        playOrderChime();
        showToast('🚨 NEW 10-MIN ORDER RECEIVED!', 'success');
      }
    }
    knownOrderIds = new Set(ids);
    initialLoadDone = true;
    renderStoreOrders();
  });

  db.ref('products').on('value', snap => {
    allProducts = snap.val() || {};
    renderStoreStock();
  });
}

function toggleStoreOpenStatus() {
  const next = !(activeStoreObj && activeStoreObj.isOpen !== false);
  db.ref('stores/' + activeStoreId).update({ isOpen: next });
}

function switchTermTab(viewId, btn) {
  document.getElementById('queueView').style.display = viewId === 'queueView' ? 'block' : 'none';
  document.getElementById('stockView').style.display = viewId === 'stockView' ? 'block' : 'none';
  document.querySelectorAll('.p-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function renderStoreOrders() {
  const list = Object.values(storeOrders).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const validOrders = list.filter(o => o.status !== 'CANCELLED');
  const activeOrders = list.filter(o => o.status === 'PLACED' || o.status === 'PACKING');

  const gross = validOrders.reduce((s, o) => s + (Number(o.totalAmount) || 0), 0);
  const net88 = Math.round(gross * 0.88);

  document.getElementById('stActiveCount').textContent = activeOrders.length;
  document.getElementById('stGrossSales').textContent = `₹${gross.toLocaleString('en-IN')}`;
  document.getElementById('stNetPayout').textContent = `₹${net88.toLocaleString('en-IN')}`;

  const grid = document.getElementById('storeOrdersGrid');
  if (list.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748B;">No orders for this dark store yet. Keep terminal open for audio alerts!</div>';
    return;
  }

  grid.innerHTML = list.map(o => `
    <div class="order-card ${o.status === 'PLACED' ? 'new-alert' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>#${escapeHtml(o.orderId)}</strong>
        <span style="font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:#FEF3C7;color:#92400E;">${escapeHtml(o.status)}</span>
      </div>
      <div style="font-size:12px;color:#64748B;margin:4px 0;">${escapeHtml(o.customerName)} • ${escapeHtml(o.customerPhone)}</div>
      <div style="font-size:12px;color:#334155;margin-bottom:8px;">📍 ${escapeHtml(o.customerAddress)}</div>
      <div style="background:#F8FAFC;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px;">
        ${(o.items || []).map(i => `<div style="display:flex;justify-content:space-between;padding:2px 0;"><span>${escapeHtml(i.name)} (${escapeHtml(i.unit)})</span><strong>x${i.qty}</strong></div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:12px;">${escapeHtml(o.paymentMethod)}</span>
        <strong style="font-size:15px;">₹${o.totalAmount}</strong>
      </div>
      <div style="display:flex;gap:8px;">
        ${o.status === 'PLACED' ? `<button class="btn btn-yellow" style="flex:1;" onclick="setOrderStep('${o.orderId}','PACKING')">📦 Start Packing</button>` : ''}
        ${o.status === 'PACKING' ? `<button class="btn btn-green" style="flex:1;" onclick="setOrderStep('${o.orderId}','OUT_FOR_DELIVERY')">🛵 Ready for Rider</button>` : ''}
        ${o.status === 'OUT_FOR_DELIVERY' ? `<span style="font-size:12px;color:#0C831F;font-weight:800;">🛵 Dispatched with Rider</span>` : ''}
        ${o.status === 'DELIVERED' ? `<span style="font-size:12px;color:#166534;font-weight:800;">✅ Delivered</span>` : ''}
      </div>
    </div>
  `).join('');
}

function setOrderStep(orderId, status) {
  db.ref('orders/' + orderId).update({ status })
    .then(() => showToast(`Order #${orderId} → ${status}`, 'success'));
}

function renderStoreStock() {
  const q = document.getElementById('storeStockSearch').value.trim().toLowerCase();
  const grid = document.getElementById('storeStockGrid');
  const items = Object.entries(allProducts).filter(([, p]) => p && (!q || (p.name || '').toLowerCase().includes(q)));

  grid.innerHTML = items.map(([id, p]) => {
    const isOos = p.outOfStock && p.outOfStock[activeStoreId] === true;
    return `
      <div class="stock-item">
        <div>
          <div style="font-size:13px;font-weight:700;">${escapeHtml(p.name)}</div>
          <div style="font-size:11px;color:#64748B;">${escapeHtml(p.unit)} • ₹${p.price}</div>
        </div>
        <button class="btn ${isOos ? 'btn-red' : 'btn-green'}" style="padding:6px 10px;font-size:11px;" onclick="toggleLocalOos('${id}', ${!isOos})">
          ${isOos ? 'Out of Stock' : 'In Stock'}
        </button>
      </div>
    `;
  }).join('');
}

function toggleLocalOos(prodId, markOos) {
  db.ref(`products/${prodId}/outOfStock/${activeStoreId}`).set(markOos ? true : null)
    .then(() => showToast(markOos ? 'Marked Out of Stock' : 'Marked In Stock', 'dark'));
}
</script>
</body>
</html>
