<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jhatpat Store Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
    <!-- Firebase SDKs (Compat v9/v10 for zero-build direct browser execution) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
      const firebaseConfig = {
        projectId: "jhatpat-22aa8",
        databaseURL: "https://jhatpat-22aa8-default-rtdb.firebaseio.com",
        authDomain: "jhatpat-22aa8.firebaseapp.com",
        storageBucket: "jhatpat-22aa8.appspot.com"
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
    </script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <!-- Password Gate (KING@001) -->
  <div id="storeLoginScreen" class="min-h-screen flex items-center justify-center p-4 bg-indigo-950">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <span class="text-3xl font-extrabold text-indigo-600">🏪 Jhatpat Store</span>
        <p class="text-xs text-gray-500 mt-1">Store Operations & Order Packing Portal</p>
      </div>
      <form onsubmit="verifyStoreLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Store Access Password</label>
          <input type="password" id="storePassInput" required placeholder="Enter Store Password"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <p id="storeLoginError" class="text-red-600 text-xs font-semibold hidden">Invalid Store Password!</p>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition">
          Enter Store Portal
        </button>
      </form>
    </div>
  </div>

  <!-- Store Dashboard -->
  <div id="storeDashboard" class="hidden min-h-screen pb-12">
    <header class="bg-indigo-700 text-white shadow">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-extrabold">🏪 Jhatpat Store Portal</h1>
          <p class="text-xs text-indigo-200">Live Order Acceptance, Packing & Rider Handover</p>
        </div>
        <button onclick="logoutStore()" class="bg-indigo-900 hover:bg-indigo-800 text-xs font-semibold px-3 py-2 rounded-xl">
          Logout
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-6">
      <!-- Filter Tabs -->
      <div class="flex gap-2 overflow-x-auto pb-4">
        <button onclick="setStoreFilter('Active')" id="tabActive" class="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow">
          Active Orders
        </button>
        <button onclick="setStoreFilter('Delivered')" id="tabDelivered" class="px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 border">
          Completed / Delivered
        </button>
        <button onclick="setStoreFilter('Cancelled')" id="tabCancelled" class="px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 border">
          Cancelled
        </button>
      </div>

      <div id="storeOrdersContainer" class="space-y-4"></div>
    </main>
  </div>

  <script>
    const STORE_PASS = 'KING@001';
    let allOrders = [];
    let currentFilter = 'Active';

    if (sessionStorage.getItem('jhatpat_store_auth') === 'true') {
      unlockStore();
    }

    function verifyStoreLogin(e) {
      e.preventDefault();
      const val = document.getElementById('storePassInput').value.trim();
      if (val === STORE_PASS) {
        sessionStorage.setItem('jhatpat_store_auth', 'true');
        document.getElementById('storeLoginError').classList.add('hidden');
        unlockStore();
      } else {
        document.getElementById('storeLoginError').classList.remove('hidden');
      }
    }

    function logoutStore() {
      sessionStorage.removeItem('jhatpat_store_auth');
      location.reload();
    }

    function unlockStore() {
      document.getElementById('storeLoginScreen').classList.add('hidden');
      document.getElementById('storeDashboard').classList.remove('hidden');
      listenStoreOrders();
    }

    function listenStoreOrders() {
      db.ref('orders').on('value', (snap) => {
        const data = snap.val() || {};
        allOrders = Object.keys(data)
          .map(key => ({ id: key, ...data[key] }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        renderStoreOrders();
      });
    }

    function setStoreFilter(filter) {
      currentFilter = filter;
      ['Active', 'Delivered', 'Cancelled'].forEach(t => {
        const btn = document.getElementById('tab' + t);
        if (t === filter) {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow';
        } else {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 border';
        }
      });
      renderStoreOrders();
    }

    function renderStoreOrders() {
      const container = document.getElementById('storeOrdersContainer');
      const filtered = allOrders.filter(o => {
        if (currentFilter === 'Active') return o.status !== 'Delivered' && o.status !== 'Cancelled';
        return o.status === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center text-gray-500 border">No ${currentFilter.toLowerCase()} orders right now.</div>`;
        return;
      }

      container.innerHTML = filtered.map(o => `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-200">
          <div class="flex flex-wrap justify-between items-start gap-2 border-b pb-3 mb-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-gray-900 text-base">#${o.orderId}</span>
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${
                  o.status === 'Pending' ? 'bg-amber-100 text-amber-800' :
                  o.status === 'Packing' ? 'bg-purple-100 text-purple-800' :
                  o.status === 'Ready for Pickup' ? 'bg-blue-100 text-blue-800' :
                  o.status === 'Out for Delivery' ? 'bg-cyan-100 text-cyan-800' :
                  o.status === 'Delivered' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                }">${o.status}</span>
              </div>
              <p class="text-xs text-gray-500 mt-1">Customer: <strong>${o.customerName}</strong> (${o.customerPhone})</p>
              <p class="text-xs text-gray-600">Address: ${o.customerAddress}</p>
            </div>
            <div class="text-right">
              <p class="text-lg font-extrabold text-indigo-700">₹${o.totalAmount}</p>
              <p class="text-xs text-gray-500">${o.paymentMode || 'COD'}</p>
            </div>
          </div>

          <div class="bg-gray-50 rounded-xl p-3 mb-4 space-y-1">
            ${(o.items || []).map(item => `
              <div class="flex justify-between text-xs text-gray-800">
                <span><strong>${item.qty}x</strong> ${item.name} (${item.unit || ''})</span>
                <span>₹${item.price * item.qty}</span>
              </div>
            `).join('')}
          </div>

          <div class="flex flex-wrap gap-2">
            ${o.status === 'Pending' ? `
              <button onclick="updateOrderStatus('${o.orderId}', 'Packing')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-4 py-2 rounded-xl">
                Accept & Start Packing
              </button>
            ` : ''}
            ${o.status === 'Packing' ? `
              <button onclick="updateOrderStatus('${o.orderId}', 'Ready for Pickup')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-xl">
                Mark Ready for Rider Pickup
              </button>
            ` : ''}
            ${(o.status === 'Pending' || o.status === 'Packing' || o.status === 'Ready for Pickup') ? `
              <button onclick="updateOrderStatus('${o.orderId}', 'Cancelled')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-4 py-2 rounded-xl ml-auto">
                Cancel Order
              </button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      try {
        await db.ref('orders/' + orderId).update({
          status: newStatus,
          updatedAt: Date.now()
        });
      } catch (err) {
        alert('Status update failed: ' + err.message);
      }
    }
  </script>
</body>
</html>
