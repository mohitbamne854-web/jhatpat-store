<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jhatpat Store Packing App</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; padding-bottom: 60px; }
    .hidden { display: none !important; }
    #loginBox { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #1e293b; }
    .login-card { background: #fff; padding: 28px; border-radius: 22px; width: 100%; max-width: 350px; text-align: center; }
    .login-card h2 { margin: 0 0 6px; color: #2563eb; font-size: 24px; font-weight: 900; }
    .login-card input { width: 100%; padding: 12px; margin: 14px 0; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 15px; text-align: center; font-weight: 700; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 11px 16px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; font-size: 13px; }
    .btn-green { background: #16a34a; }
    .btn-sm { padding: 8px 12px; width: auto; font-size: 12px; }
    header { background: #1e3a8a; color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 900; }
    .wrap { max-width: 800px; margin: 14px auto; padding: 0 12px; }
    .order-card { background: #fff; border-radius: 16px; padding: 15px; border: 1px solid #cbd5e1; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .badge { padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; background: #fef9c3; color: #854d0e; }
    .items-box { background: #f8fafc; padding: 10px; border-radius: 10px; margin: 10px 0; font-size: 13px; border: 1px dashed #cbd5e1; }
  </style>
</head>
<body>

  <div id="loginBox">
    <div class="login-card">
      <h2>📦 Jhatpat Store</h2>
      <p style="font-size:12px;color:#64748b;margin:0;">स्टोर पैकिंग स्टाफ लॉगिन</p>
      <input type="password" id="storePass" placeholder="पासवर्ड डालें" />
      <button class="btn" onclick="checkStoreLogin()">स्टोर खोलें</button>
    </div>
  </div>

  <div id="storeApp" class="hidden">
    <header>
      <h1>📦 Jhatpat Store Packing</h1>
      <button class="btn btn-sm btn-green" onclick="loadStoreOrders()">🔄 रिफ्रेश</button>
    </header>
    <div class="wrap">
      <div id="storeOrdersList"><p style="text-align:center;color:#64748b;">ऑर्डर्स लोड हो रहे हैं...</p></div>
    </div>
  </div>
  <script>
    const FIREBASE_URL = "https://firebaseio.com";
    const STORE_PASSWORD = "KING@001";

    function checkStoreLogin() {
      const val = document.getElementById("storePass").value.trim();
      if (val === STORE_PASSWORD) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("storeApp").classList.remove("hidden");
        loadStoreOrders();
        setInterval(loadStoreOrders, 15000);
      } else {
        alert("❌ गलत पासवर्ड! कृपया KING@001 डालें।");
      }
    }

    async function loadStoreOrders() {
      const box = document.getElementById("storeOrdersList");
      try {
        const res = await fetch(`${FIREBASE_URL}/orders.json`);
        const data = await res.json();
        if (!data) {
          box.innerHTML = `<p style="text-align:center;color:#64748b;padding:30px;">अभी कोई नया ऑर्डर नहीं है।</p>`;
          return;
        }
        const orders = Object.values(data).reverse().filter(o => o.status !== "Delivered");
        if (orders.length === 0) {
          box.innerHTML = `<p style="text-align:center;color:#16a34a;font-weight:700;padding:30px;">✅ सभी ऑर्डर पैक होकर डिलीवर हो चुके हैं!</p>`;
          return;
        }
        box.innerHTML = "";
        orders.forEach(o => {
          const itemsHtml = (o.items || []).map(i => `<div>• <b>${i.name}</b> (${i.weight || ""}) × <b>${i.qty}</b></div>`).join("");
          box.innerHTML += `
            <div class="order-card">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <b style="font-size:15px;">ऑर्डर #${o.id}</b>
                <span class="badge">${o.status || "Order Placed"}</span>
              </div>
              <p style="font-size:12px;color:#475569;margin:6px 0;">👤 ${o.customerName} | 📞 ${o.phone}<br>📍 ${o.address}</p>
              <div class="items-box">${itemsHtml || "सामान की लिस्ट"}</div>
              <div style="display:flex;gap:8px;">
                <button class="btn" onclick="updatePackStatus('${o.id}', 'Packing')">📦 पैकिंग चालू करें</button>
                <button class="btn btn-green" onclick="updatePackStatus('${o.id}', 'Out for Delivery')">✅ पैक हो गया (Rider को दें)</button>
              </div>
            </div>
          `;
        });
      } catch (e) {
        box.innerHTML = `<p style="text-align:center;color:#ef4444;">नेटवर्क त्रुटि, रिफ्रेश दबाएं।</p>`;
      }
    }

    async function updatePackStatus(id, status) {
      await fetch(`${FIREBASE_URL}/orders/${id}.json`, {
        method: "PATCH",
        body: JSON.stringify({ status })
      });
      loadStoreOrders();
    }
  </script>
</body>
</html>
