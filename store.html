<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jhatpat - Dark Store Packing App</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-xl mx-auto">
    <div class="bg-yellow-500 text-black p-4 rounded-2xl shadow mb-4 flex justify-between items-center">
      <div><h1 class="text-xl font-black">🏪 DARK STORE PACKING APP</h1><p class="text-xs font-bold">ऑर्डर पैक करें और राइडर को सौंपें</p></div>
      <button onclick="loadOrders()" class="bg-black text-white px-3 py-1.5 rounded-xl text-xs font-bold">🔄 Refresh</button>
    </div>

    <div id="loginBox" class="bg-white p-5 rounded-2xl shadow text-center">
      <p class="text-xs text-gray-600 mb-2">स्टोर स्टाफ पासवर्ड डालें (Default: <b>store123</b>)</p>
      <input type="password" id="pass" placeholder="पासवर्ड" class="border rounded-xl px-3 py-2 text-sm text-center w-full mb-3" />
      <button onclick="unlock()" class="w-full bg-gray-900 text-yellow-400 py-2.5 rounded-xl font-extrabold text-sm">लॉगिन करें</button>
    </div>

    <div id="appArea" class="hidden space-y-3"></div>
  </div>

  <script>
    const FIREBASE_DB_URL = "";
    let orders = [];
    function getDbUrl() { return (FIREBASE_DB_URL || localStorage.getItem('jhatpat_firebase_url') || "").replace(/\/$/, ""); }

    function unlock() {
      if (document.getElementById('pass').value === 'store123') {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('appArea').classList.remove('hidden');
        loadOrders();
        setInterval(loadOrders, 10000);
      } else alert("❌ गलत पासवर्ड!");
    }

    async function loadOrders() {
      const url = getDbUrl();
      if (url) {
        const res = await fetch(`${url}/selfMasterData/orders.json`);
        orders = (await res.json()) || [];
      } else {
        orders = JSON.parse(localStorage.getItem('jhatpat_orders')) || [];
      }
      render();
    }

    async function setStatus(idx, st) {
      orders[idx].status = st;
      localStorage.setItem('jhatpat_orders', JSON.stringify(orders));
      const url = getDbUrl();
      if (url) await fetch(`${url}/selfMasterData/orders.json`, { method: 'PUT', body: JSON.stringify(orders) });
      render();
    }

    function render() {
      const area = document.getElementById('appArea');
      area.innerHTML = orders.length === 0 ? "<p class='text-center text-gray-500'>कोई ऑर्डर नहीं है।</p>" : orders.map((o, i) => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-yellow-500 space-y-1.5">
          <div class="flex justify-between font-extrabold text-sm"><span>${o.id} - ${o.name}</span><span class="text-blue-700">${o.status}</span></div>
          <p class="text-xs text-gray-500">⏰ ${o.time} | पेमेंट: <b>${o.mode} (₹${o.total})</b></p>
          <div class="bg-yellow-50 p-2.5 rounded-xl text-xs font-bold text-gray-800">🛒 सामान: ${o.items}</div>
          <div class="flex gap-2 pt-2">
            <button onclick="setStatus(${i}, 'Packing 📦')" class="flex-1 bg-yellow-500 text-black py-2 rounded-xl text-xs font-extrabold">📦 पैकिंग शुरू</button>
            <button onclick="setStatus(${i}, 'Ready for Pickup 🛍️')" class="flex-1 bg-green-600 text-white py-2 rounded-xl text-xs font-extrabold">✅ पैक हो गया (Ready)</button>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
  </html>
