<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhatpat - 10 Minute Grocery & Sabzi Delivery</title>
    <style>
        :root {
            --yellow: #f8cb46;
            --green: #0c831f;
            --dark: #1c1c1c;
            --bg: #f4f6fb;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--dark); padding-bottom: 90px; }

        /* Top Header */
        header {
            background: var(--yellow);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .brand { font-size: 22px; font-weight: 900; color: var(--dark); }
        .delivery-time { font-size: 12px; font-weight: 700; color: var(--green); background: white; padding: 4px 10px; border-radius: 20px; }

        .store-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .store-selector select {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-weight: 600;
            font-size: 13px;
            background: white;
        }
        .gps-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Categories */
        .cat-bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .cat-chip {
            padding: 7px 14px;
            background: #f3f4f6;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .cat-chip.active { background: #dcfce7; color: var(--green); border-color: var(--green); }

        /* Product Grid */
        .container { max-width: 1000px; margin: 15px auto; padding: 0 14px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 12px;
        }
        .prod-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .disc-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #2563eb;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .prod-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #f9fafb; }
        .prod-title { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
        .prod-weight { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 15px; font-weight: 800; color: var(--dark); }
        .mrp { font-size: 11px; color: #9ca3af; text-decoration: line-through; display: block; }
        
        .add-btn {
            background: #f0fdf4;
            color: var(--green);
            border: 1px solid var(--green);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }
        .qty-box {
            display: flex;
            align-items: center;
            background: var(--green);
            color: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .qty-box button { background: none; border: none; color: white; padding: 6px 9px; font-weight: bold; cursor: pointer; }
        .qty-box span { font-size: 13px; font-weight: bold; padding: 0 4px; }

        /* Floating Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: var(--green);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 20px rgba(12,131,31,0.35);
            z-index: 200;
            cursor: pointer;
        }

        /* Checkout Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 300;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-content input {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="brand">⚡ Jhatpat</div>
            <div class="delivery-time" id="eta-badge">🚀 Delivery in 10 mins</div>
        </div>
        <div class="store-selector">
            <select id="customer-store" onchange="changeStore()">
                <option value="ALL">📍 Select Your Area / Store</option>
            </select>
            <button class="gps-btn" onclick="detectNearestStore()">📍 Auto GPS</button>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search tomato, potato, milk, atta..." onkeyup="renderProducts()">
        </div>
    </header>

    <div class="cat-bar">
        <div class="cat-chip active" onclick="filterCategory('ALL', this)">All Items</div>
        <div class="cat-chip" onclick="filterCategory('Sabzi & Fruits', this)">🥬 Sabzi & Fruits</div>
        <div class="cat-chip" onclick="filterCategory('Dairy & Bread', this)">🥛 Dairy & Bread</div>
        <div class="cat-chip" onclick="filterCategory('Atta, Rice & Dal', this)">🌾 Atta & Dal</div>
        <div class="cat-chip" onclick="filterCategory('Snacks & Drinks', this)">🥤 Snacks</div>
        <div class="cat-chip" onclick="filterCategory('Masala & Oil', this)">🫙 Masala & Oil</div>
    </div>

    <div class="container">
        <div id="closed-banner" style="display:none; background:#fee2e2; color:#991b1b; padding:12px; border-radius:10px; margin-bottom:15px; font-weight:bold; text-align:center;">
            ⚠️ Yeh Store abhi band (Closed) hai. Kripya doosra nazdeeki store chunein.
        </div>
        <div id="products-grid" class="grid">
            <p style="color:#666;">Loading fresh items...</p>
        </div>
    </div>

    <!-- Bottom Cart Bar -->
    <div class="cart-bar" id="cart-bar" onclick="openCheckout()">
        <div>
            <div style="font-size:12px; opacity:0.9;" id="cart-count">0 ITEMS</div>
            <div style="font-size:16px; font-weight:800;" id="cart-total">₹0</div>
        </div>
        <div style="font-weight:800; font-size:15px;">View Cart & Order ➔</div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2>🛒 Your Basket</h2>
                <button onclick="closeCheckout()" style="border:none; background:#eee; padding:6px 12px; border-radius:8px; font-weight:bold;">✕ Close</button>
            </div>
            <div id="cart-items-list" style="margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;"></div>
            
            <h3 style="font-size:15px; margin-bottom:8px;">Delivery Details</h3>
            <input type="text" id="cust-name" placeholder="Your Full Name">
            <input type="tel" id="cust-phone" placeholder="Mobile Number (10 digits)">
            <input type="text" id="cust-address" placeholder="Flat No, Building, Landmark, Area">
            
            <button onclick="placeOrder()" style="width:100%; background:var(--green); color:white; border:none; padding:14px; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer;">
                Place Cash on Delivery Order • <span id="modal-total">₹0</span>
            </button>
        </div>
    </div>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcxcKM6AA20FA3ka0f1LKlMX8JLLqXODQ",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "jhatpat-22aa8",
            storageBucket: "jhatpat-22aa8.firebasestorage.app",
            messagingSenderId: "51391257177",
            appId: "1:51391257177:web:2537fdd28d123dd8d0ef48"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProducts = [];
        let allStores = {};
        let selectedStoreId = "ALL";
        let selectedCategory = "ALL";
        let cart = {};

        // 1. Load Stores in Real-Time
        db.ref('stores').on('value', (snapshot) => {
            allStores = {};
            const select = document.getElementById('customer-store');
            const currentVal = select.value;
            select.innerHTML = '<option value="ALL">📍 All Areas (Show All Live Items)</option>';

            snapshot.forEach((child) => {
                const st = child.val();
                allStores[st.id] = st;
                select.innerHTML += `<option value="${st.id}">${st.name} - ${st.area} ${st.isOpen ? '🟢' : '🔴 (Closed)'}</option>`;
            });

            if (allStores[currentVal]) select.value = currentVal;
            changeStore();
        });

        function changeStore() {
            selectedStoreId = document.getElementById('customer-store').value;
            const banner = document.getElementById('closed-banner');
            const eta = document.getElementById('eta-badge');

            if (selectedStoreId !== "ALL" && allStores[selectedStoreId]) {
                const st = allStores[selectedStoreId];
                banner.style.display = st.isOpen ? 'none' : 'block';
                eta.innerText = st.isOpen ? `⚡ 10 mins from ${st.area}` : '🔴 Store Closed';
            } else {
                banner.style.display = 'none';
                eta.innerText = '🚀 Delivery in 10 mins';
            }
            renderProducts();
        }

        // Auto-detect Nearest Store using GPS
        function detectNearestStore() {
            if (!navigator.geolocation) {
                alert("Aapke browser mein GPS support nahi hai.");
                return;
            }
            navigator.geolocation.getCurrentPosition((pos) => {
                const uLat = pos.coords.latitude;
                const uLng = pos.coords.longitude;
                let nearestId = null;
                let minDist = 9999;

                Object.values(allStores).forEach(st => {
                    if (st.isOpen && st.lat && st.lng) {
                        const d = Math.hypot(uLat - st.lat, uLng - st.lng) * 111; // approx KM
                        if (d <= (st.radius || 5) && d < minDist) {
                            minDist = d;
                            nearestId = st.id;
                        }
                    }
                });

                if (nearestId) {
                    document.getElementById('customer-store').value = nearestId;
                    changeStore();
                    alert(`📍 Aapke sabse nazdeeki store "${allStores[nearestId].name}" se connect kar diya gaya hai!`);
                } else {
                    alert("Aapke area mein abhi koi open store nahi mila, sabhi items dikhaye ja rahe hain.");
                }
            }, () => {
                alert("Location permission allow karein ya dropdown se apna area chunein.");
            });
        }

        // 2. Load Products in Real-Time (Instant Sync from Admin)
        db.ref('products').on('value', (snapshot) => {
            allProducts = [];
            snapshot.forEach((child) => {
                allProducts.push(child.val());
            });
            renderProducts();
        });

        function filterCategory(cat, el) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const query = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = allProducts.filter(p => {
                if (!p.inStock) return false;
                if (selectedStoreId !== "ALL" && p.storeId !== "ALL" && p.storeId !== selectedStoreId) return false;
                if (selectedCategory !== "ALL" && p.category !== selectedCategory) return false;
                if (query && !p.name.toLowerCase().includes(query)) return false;
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#666; padding:30px;">Koi item available nahi hai.</p>';
                return;
            }

            filtered.forEach(p => {
                const qty = cart[p.id] ? cart[p.id].qty : 0;
                grid.innerHTML += `
                    <div class="prod-card">
                        ${p.discount > 0 ? `<div class="disc-tag">${p.discount}% OFF</div>` : ''}
                        <img src="${p.image}" alt="${p.name}">
                        <div>
                            <div class="prod-title">${p.name}</div>
                            <div class="prod-weight">${p.weight}</div>
                            <div class="price-row">
                                <div>
                                    <span class="price">₹${p.price}</span>
                                    ${p.mrp > p.price ? `<span class="mrp">₹${p.mrp}</span>` : ''}
                                </div>
                                ${qty === 0 
                                    ? `<button class="add-btn" onclick="updateCart('${p.id}', 1)">ADD</button>`
                                    : `<div class="qty-box">
                                        <button onclick="updateCart('${p.id}', -1)">-</button>
                                        <span>${qty}</span>
                                        <button onclick="updateCart('${p.id}', 1)">+</button>
                                       </div>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 3. Cart & Checkout Logic
        function updateCart(id, delta) {
            const prod = allProducts.find(p => p.id === id);
            if (!prod) return;

            if (!cart[id]) cart[id] = { ...prod, qty: 0 };
            cart[id].qty += delta;
            if (cart[id].qty <= 0) delete cart[id];

            renderProducts();
            updateCartBar();
        }

        function updateCartBar() {
            const bar = document.getElementById('cart-bar');
            let count = 0, total = 0;
            Object.values(cart).forEach(item => {
                count += item.qty;
                total += item.price * item.qty;
            });

            if (count > 0) {
                bar.style.display = 'flex';
                document.getElementById('cart-count').innerText = `${count} ITEM${count > 1 ? 'S' : ''}`;
                document.getElementById('cart-total').innerText = `₹${total}`;
                document.getElementById('modal-total').innerText = `₹${total}`;
            } else {
                bar.style.display = 'none';
                closeCheckout();
            }
        }

        function openCheckout() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            Object.values(cart).forEach(item => {
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
                        <span>${item.name} (${item.weight}) × <b>${item.qty}</b></span>
                        <b>₹${item.price * item.qty}</b>
                    </div>
                `;
            });
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function placeOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert("Kripya apna Naam, Mobile Number aur Poora Pata dalein!");
                return;
            }

            let total = 0;
            const itemsArray = Object.values(cart).map(i => {
                total += i.price * i.qty;
                return { name: i.name, weight: i.weight, qty: i.qty, price: i.price };
            });

            const orderRef = db.ref('orders').push();
            orderRef.set({
                orderId: orderRef.key,
                storeId: selectedStoreId,
                customerName: name,
                phone: phone,
                address: address,
                items: itemsArray,
                total: total,
                status: "NEW",
                createdAt: Date.now()
            }).then(() => {
                alert("🎉 Order Confirm ho gaya! 10 minute mein delivery aapke ghar pahunchegi.");
                cart = {};
