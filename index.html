<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jhatpat - Instant Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
    <!-- Firebase SDKs (Compat v9/v10 for zero-build direct browser execution) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
      const firebaseConfig = {
        projectId: "jhatpat-22aa8",
        databaseURL: "https://jhatpat-22aa8-default-rtdb.firebaseio.com",
        authDomain: "jhatpat-22aa8.firebaseapp.com",
        storageBucket: "jhatpat-22aa8.appspot.com"
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();
    </script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="pb-24">
  <!-- Header -->
  <header class="sticky top-0 z-40 bg-emerald-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl font-extrabold tracking-tight">⚡ Jhatpat</span>
          <span class="text-xs bg-emerald-800 px-2 py-0.5 rounded-full font-semibold">10-15 Mins</span>
        </div>
        <p class="text-xs text-emerald-100 mt-0.5">Direct Instant Delivery • No Dark Store Restrictions</p>
      </div>
      <button onclick="toggleOrdersModal()" class="bg-white/20 hover:bg-white/30 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
        My Orders
      </button>
    </div>
    <!-- Search Bar -->
    <div class="max-w-4xl mx-auto px-4 pb-3">
      <input id="searchInput" type="text" oninput="renderProducts()" placeholder="Search groceries, snacks, beverages..."
        class="w-full px-4 py-2.5 rounded-xl text-gray-800 text-sm focus:outline-none shadow-inner" />
    </div>
  </header>

  <!-- Category Filter Pills -->
  <div class="max-w-4xl mx-auto px-4 pt-4">
    <div id="categoryBar" class="flex gap-2 overflow-x-auto hide-scrollbar pb-2"></div>
  </div>

  <!-- Product Grid -->
  <main class="max-w-4xl mx-auto px-4 pt-3">
    <div id="loadingState" class="text-center py-12 text-gray-500 font-medium">Loading fresh products...</div>
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
  </main>

  <!-- Floating Cart Bar -->
  <div id="cartBar" class="hidden fixed bottom-4 left-4 right-4 max-w-4xl mx-auto bg-emerald-600 text-white rounded-2xl shadow-xl p-4 flex items-center justify-between z-40 cursor-pointer" onclick="openCheckoutModal()">
    <div>
      <p id="cartSummaryText" class="font-bold text-sm">0 Items | ₹0</p>
      <p class="text-xs text-emerald-100">Tap to place direct order</p>
    </div>
    <span class="bg-white text-emerald-700 font-bold text-sm px-4 py-2 rounded-xl shadow">Proceed to Checkout →</span>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 class="text-lg font-bold text-gray-800">Complete Your Order</h2>
        <button onclick="closeCheckoutModal()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
      </div>

      <!-- Cart Items Review -->
      <div id="checkoutItemsList" class="space-y-2 mb-4 max-h-48 overflow-y-auto border-b pb-3"></div>

      <!-- Bill Details -->
      <div class="bg-gray-50 p-3 rounded-xl text-sm space-y-1 mb-4">
        <div class="flex justify-between text-gray-600"><span>Item Total</span><span id="billItemTotal">₹0</span></div>
        <div class="flex justify-between text-gray-600"><span>Delivery Fee</span><span class="text-emerald-600 font-semibold">FREE</span></div>
        <div class="flex justify-between font-bold text-gray-900 text-base border-t pt-1 mt-1"><span>Grand Total</span><span id="billGrandTotal">₹0</span></div>
      </div>

      <!-- Customer Details Form (Direct Order - No Dark Store check/block) -->
      <form id="orderForm" onsubmit="placeDirectOrder(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Full Name *</label>
          <input type="text" id="custName" required placeholder="Enter your name" class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Mobile Number *</label>
          <input type="tel" id="custPhone" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Full Delivery Address *</label>
          <textarea id="custAddress" required rows="2" placeholder="House/Flat No., Building, Street, Landmark" class="w-full border rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Payment Mode</label>
          <select id="paymentMode" class="w-full border rounded-xl px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
            <option value="UPI on Delivery">UPI on Delivery</option>
          </select>
        </div>
        <button type="submit" id="placeOrderBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
          Place Order Now
        </button>
      </form>
    </div>
  </div>

  <!-- Live Order Tracking Modal -->
  <div id="ordersModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 class="text-lg font-bold text-gray-800">My Live Orders</h2>
        <button onclick="toggleOrdersModal()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
      </div>
      <div id="myOrdersList" class="space-y-3 text-sm">
        <p class="text-gray-500 text-center py-6">No recent orders placed from this device.</p>
      </div>
    </div>
  </div>

  <script>
    let products = [];
    let cart = JSON.parse(localStorage.getItem('jhatpat_cart') || '{}');
    let selectedCategory = 'All';
    let myOrderIds = JSON.parse(localStorage.getItem('jhatpat_my_orders') || '[]');

    const FALLBACK_IMG = 'https://placehold.co/300x300/e2e8f0/475569?text=Jhatpat+Item';

    // Real-time Products Sync from Firebase
    db.ref('products').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      products = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      document.getElementById('loadingState').style.display = 'none';
      renderCategories();
      renderProducts();
      updateCartUI();
    }, (err) => {
      document.getElementById('loadingState').innerText = 'Error loading store: ' + err.message;
    });

    function renderCategories() {
      const cats = ['All', ...new Set(products.map(p => p.category || 'General').filter(Boolean))];
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = cats.map(c => `
        <button onclick="selectCategory('${c.replace(/'/g, "\\'")}')"
          class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${selectedCategory === c ? 'bg-emerald-600 text-white shadow' : 'bg-white text-gray-700 border hover:bg-gray-100'}">
          ${c}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('productGrid');
      const filtered = products.filter(p => {
        const matchCat = selectedCategory === 'All' || (p.category || 'General') === selectedCategory;
        const matchQuery = !query || (p.name || '').toLowerCase().includes(query) || (p.category || '').toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">No products found.</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const qty = cart[p.id] || 0;
        const inStock = p.inStock !== false && (p.stock === undefined || Number(p.stock) > 0);
        const price = Number(p.price || 0);
        const mrp = Number(p.mrp || price);
        return `
          <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col justify-between">
            <div>
              <div class="relative w-full h-32 bg-gray-50 rounded-xl overflow-hidden mb-2 flex items-center justify-center">
                <img src="${p.image || FALLBACK_IMG}" onerror="this.src='${FALLBACK_IMG}'" alt="${p.name}" class="object-cover w-full h-full" />
                ${!inStock ? '<span class="absolute inset-0 bg-white/80 flex items-center justify-center text-xs font-bold text-red-600">Out of Stock</span>' : ''}
              </div>
              <span class="text-[10px] font-semibold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">${p.category || 'Grocery'}</span>
              <h3 class="font-bold text-gray-800 text-sm mt-1 line-clamp-2">${p.name}</h3>
              <p class="text-xs text-gray-400">${p.unit || '1 Unit'}</p>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <div>
                <span class="font-extrabold text-gray-900 text-sm">₹${price}</span>
                ${mrp > price ? `<span class="text-xs text-gray-400 line-through ml-1">₹${mrp}</span>` : ''}
              </div>
              ${!inStock ? `<button disabled class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-400 text-xs font-bold">Sold Out</button>` :
                qty === 0 ? `<button onclick="updateQty('${p.id}', 1)" class="px-3.5 py-1.5 rounded-lg border border-emerald-600 text-emerald-600 hover:bg-emerald-600 hover:text-white text-xs font-bold transition">ADD</button>` :
                `<div class="flex items-center bg-emerald-600 text-white rounded-lg overflow-hidden">
                  <button onclick="updateQty('${p.id}', -1)" class="px-2.5 py-1 font-bold text-sm">−</button>
                  <span class="px-2 text-xs font-bold">${qty}</span>
                  <button onclick="updateQty('${p.id}', 1)" class="px-2.5 py-1 font-bold text-sm">+</button>
                </div>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function updateQty(id, delta) {
      const next = (cart[id] || 0) + delta;
      if (next <= 0) delete cart[id];
      else cart[id] = next;
      localStorage.setItem('jhatpat_cart', JSON.stringify(cart));
      renderProducts();
      updateCartUI();
    }

    function updateCartUI() {
      let totalItems = 0;
      let totalAmount = 0;
      Object.keys(cart).forEach(id => {
        const prod = products.find(p => p.id === id);
        if (prod) {
          totalItems += cart[id];
          totalAmount += Number(prod.price || 0) * cart[id];
        }
      });

      const bar = document.getElementById('cartBar');
      if (totalItems > 0) {
        bar.classList.remove('hidden');
        document.getElementById('cartSummaryText').innerText = `${totalItems} Item${totalItems > 1 ? 's' : ''} | ₹${totalAmount}`;
      } else {
        bar.classList.add('hidden');
      }
    }

    function openCheckoutModal() {
      const list = document.getElementById('checkoutItemsList');
      let html = '';
      let total = 0;
      Object.keys(cart).forEach(id => {
        const prod = products.find(p => p.id === id);
        if (prod) {
          const sub = Number(prod.price || 0) * cart[id];
          total += sub;
          html += `<div class="flex justify-between items-center text-sm">
            <span>${prod.name} <span class="text-gray-400">x${cart[id]}</span></span>
            <span class="font-semibold">₹${sub}</span>
          </div>`;
        }
      });
      list.innerHTML = html;
      document.getElementById('billItemTotal').innerText = '₹' + total;
      document.getElementById('billGrandTotal').innerText = '₹' + total;
      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    // Direct Order Placement — Zero Dark Store Checks or Blockers
    async function placeDirectOrder(e) {
      e.preventDefault();
      const btn = document.getElementById('placeOrderBtn');
      btn.disabled = true;
      btn.innerText = 'Placing Order...';

      const orderItems = [];
      let totalAmount = 0;
      Object.keys(cart).forEach(id => {
        const prod = products.find(p => p.id === id);
        if (prod) {
          const qty = cart[id];
          const price = Number(prod.price || 0);
          totalAmount += price * qty;
          orderItems.push({
            id: prod.id,
            name: prod.name,
            unit: prod.unit || '',
            price: price,
            qty: qty
          });
        }
      });

      if (orderItems.length === 0) {
        alert('Your cart is empty!');
        btn.disabled = false;
        btn.innerText = 'Place Order Now';
        return;
      }

      const orderId = 'JHP' + Date.now().toString().slice(-6);
      const orderPayload = {
        orderId: orderId,
        customerName: document.getElementById('custName').value.trim(),
        customerPhone: document.getElementById('custPhone').value.trim(),
        customerAddress: document.getElementById('custAddress').value.trim(),
        paymentMode: document.getElementById('paymentMode').value,
        items: orderItems,
        totalAmount: totalAmount,
        status: 'Pending',
        createdAt: Date.now()
      };

      try {
        await db.ref('orders/' + orderId).set(orderPayload);
        myOrderIds.unshift(orderId);
        localStorage.setItem('jhatpat_my_orders', JSON.stringify(myOrderIds));
        cart = {};
        localStorage.removeItem('jhatpat_cart');
        updateCartUI();
        renderProducts();
        closeCheckoutModal();
        alert('Order Placed Successfully! Order ID: ' + orderId);
        toggleOrdersModal(true);
      } catch (err) {
        alert('Failed to place order: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Place Order Now';
      }
    }

    function toggleOrdersModal(forceOpen = false) {
      const modal = document.getElementById('ordersModal');
      if (forceOpen) modal.classList.remove('hidden');
      else modal.classList.toggle('hidden');

      if (!modal.classList.contains('hidden')) {
        loadMyOrders();
      }
    }

    function loadMyOrders() {
      const container = document.getElementById('myOrdersList');
      if (myOrderIds.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-6">No recent orders placed from this device.</p>';
        return;
      }
      db.ref('orders').once('value', snap => {
        const allOrders = snap.val() || {};
        const userOrders = myOrderIds.map(id => allOrders[id]).filter(Boolean);
        if (userOrders.length === 0) {
          container.innerHTML = '<p class="text-gray-500 text-center py-6">No active orders found.</p>';
          return;
        }
        container.innerHTML = userOrders.map(o => `
          <div class="border rounded-xl p-3 bg-gray-50">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-gray-800">#${o.orderId}</span>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${
                o.status === 'Delivered' ? 'bg-emerald-100 text-emerald-700' :
                o.status === 'Out for Delivery' ? 'bg-blue-100 text-blue-700' :
                o.status === 'Cancelled' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'
              }">${o.status}</span>
            </div>
            <p class="text-xs text-gray-600 mb-1">${(o.items || []).map(i => `${i.name} x${i.qty}`).join(', ')}</p>
            <div class="flex justify-between text-xs font-semibold text-gray-800 pt-1 border-t">
              <span>Total: ₹${o.totalAmount}</span>
              <span>${new Date(o.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
          </div>
        `).join('');
      });
    }
  </script>
</body>
</html>
